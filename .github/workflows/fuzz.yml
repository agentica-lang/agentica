name: Fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of coverage-guided fuzzing (libFuzzer)
        type: number
        default: 3600

permissions:
  contents: read

jobs:
  vm-libfuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SECONDS_TO_FUZZ: ${{ inputs.seconds || 3600 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: echo "LIBFUZZ_SEED=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')" >> "$GITHUB_ENV"
      - run: echo "commit $GITHUB_SHA, seed $LIBFUZZ_SEED, $SECONDS_TO_FUZZ s"
      - run: |
          clang --version
          command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl && pkg-config --atleast-version=8.2.0 bdw-gc && pkg-config --atleast-version=1.2.0 zlib || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libgc-dev zlib1g-dev pkg-config; }
      - run: make -j"$(nproc)" vm-libfuzz-run LIBFUZZ_TIME="$SECONDS_TO_FUZZ" LIBFUZZ_JOBS="$(nproc)" LIBFUZZ_FLAGS="-seed=$LIBFUZZ_SEED"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: libfuzz-crashes
          path: build/vm/libfuzz/crashes/
          if-no-files-found: ignore
