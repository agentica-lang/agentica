name: Fuzz

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Number of mutants
        type: number
        default: 5000000

permissions:
  contents: read

jobs:
  vm-fuzz:
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 120
    env:
      SANITIZE: '1'
      RUNS: ${{ inputs.runs || 5000000 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - run: command -v clang >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang; }
      - run: echo "FUZZ_SEED=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')" >> "$GITHUB_ENV"
      - run: echo "commit $GITHUB_SHA, FUZZ_SEED=$FUZZ_SEED, FUZZ_RUNS=$RUNS"
      - run: make vm-fuzz FUZZ_RUNS="$RUNS"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: fuzz-crash.agcb
          if-no-files-found: ignore
