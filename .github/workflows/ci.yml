name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      AGENTICA_REQUIRE_VM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - run: make vm vm-test
      - run: make vm-unicode && git diff --exit-code vm/unicode_data.c
      - run: make test
      - run: make test-bdd
      - run: AGENTICA_TEST_EXECUTABLE="$PWD/dist/agentica" raco test -j 2 tests/tcp-test.rkt tests/http-test.rkt tests/process-test.rkt tests/modules-test.rkt
      - run: racket src/main.rkt --allow-run examples/process-tool.agc
      - run: racket src/main.rkt examples/dispatch.agc
      - run: racket src/main.rkt examples/concurrency.agc
      - run: racket src/main.rkt examples/hello.agc
      - run: racket src/main.rkt examples/classify.agc
      - run: racket src/main.rkt examples/tasks.agc
      - run: racket src/main.rkt examples/inventory.agc
      - run: racket src/main.rkt examples/strings.agc
      - run: racket src/main.rkt examples/result.agc
      - run: racket src/main.rkt examples/blocks.agc
      - run: racket src/main.rkt examples/json.agc
      - run: dist/agentica examples/json-modules.agc
      - run: dist/agentica check examples/json-modules.agc
      - run: dist/agentica examples/queue.agc

  docs-site:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.167.0
      HUGO_SHA256: 0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/hugo.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - run: hugo version
      - run: make site

  vm-sanitizers:
    runs-on: ubuntu-24.04
    env:
      AGENTICA_REQUIRE_VM: '1'
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - run: clang --version
      - run: make vm vm-test
      - run: make build
      - run: raco test tests/vm-diff-test.rkt tests/bytecode-test.rkt
      - run: make vm-fuzz
      - run: make vm-gc-stress

  vm-macos:
    runs-on: macos-15
    env:
      AGENTICA_REQUIRE_VM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - run: cc --version
      - run: make vm vm-test
      - run: make build
      - run: raco test tests/vm-diff-test.rkt tests/bytecode-test.rkt

  vm-windows:
    runs-on: windows-2025
    env:
      AGENTICA_REQUIRE_VM: '1'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: make mingw-w64-ucrt-x86_64-gcc
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - run: test "$(command -v gcc)" = /ucrt64/bin/gcc && gcc --version
      - run: make vm vm-test
      - run: make build
      - run: raco test tests/vm-diff-test.rkt tests/bytecode-test.rkt
