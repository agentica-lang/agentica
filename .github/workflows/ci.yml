name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/platforms.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/site-examples.yml'
      - '.github/workflows/sweep.yml'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/platforms.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/site-examples.yml'
      - '.github/workflows/sweep.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The runners can be slow (a capped CPU frequency): every deadline of the tests is multiplied by this, and so are the
# per-module limits of the Makefile (references/ci.md in the development skill has the three layers).
env:
  AGENTICA_TEST_TIMEOUT_SCALE: '4'

# One build, many runners (references/ci.md, "Pull requests"): `build` compiles dist/agentica and the C test programs once and
# uploads dist/ and build/; the shards download it (.github/actions/use-build) and run `make test`, `make test-slow` and the
# other checks, so no shard compiles. When C changed, `sanitizer-build` does the same for the sanitizer, ThreadSanitizer
# and GC stress binaries, and `jit-arm64` builds and tests on an arm64 runner. `test` and `vm-sanitizers` are the last jobs: they need every job of their half and fail when one
# failed or was cancelled, so a branch protection rule names only those two checks.
jobs:
  warm-third-party:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGENTICA_GC: vendored
      AGENTICA_ZLIB: vendored
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: perl -MIPC::Cmd -MFile::Copy -e 1 2>/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends perl; }
      - run: mkdir -p build && make -s vm-openssl-key AGENTICA_OPENSSL=vendored > build/openssl-key-release
      - uses: actions/cache@v6
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - run: make vm-openssl AGENTICA_OPENSSL=vendored
      - run: make vendored-check

  dup-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/jscpd/package-lock.json
      - run: make dup-check

  # What changed decides whether the C half runs. HEAD is the merge commit on pull_request, so HEAD^1 is the base tip: this
  # diffs the whole PR, not just the tip commit.
  changes:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      c: ${{ steps.changes.outputs.c }}
      trace: ${{ steps.changes.outputs.trace }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          c=false
          trace=false
          if [ "$EVENT" != pull_request ]; then
            c=true
            trace=true
          elif ! files=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD); then
            c=true
            trace=true
          else
            while IFS= read -r f; do
              case "$f" in
                vm/trace.*|vm/tests/trace_test.c)
                  trace=true ;;
              esac
              case "$f" in
                vm/*|Makefile|mk/*|.gitmodules|.clang-tidy|.github/workflows/ci.yml|.github/actions/*)
                  c=true ;;
              esac
            done <<< "$files"
          fi
          echo "c=$c trace=$trace"
          echo "c=$c" >> "$GITHUB_OUTPUT"
          echo "trace=$trace" >> "$GITHUB_OUTPUT"

  # The one build of the release mode: dist/agentica, the first binary of the bootstrap (tests/test_bdd_posix.py runs it) and
  # the C test programs, with the stage files and objects that make needs to see them as up to date.
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
      - name: Build the binary, the first binary of the bootstrap and the C tests (the shards run them)
        run: make -j"$(nproc)" dist/agentica build/vm/release/bootstrap/agentica vm-test-binaries
      - run: GZIP=-1 tar -czf "$RUNNER_TEMP/release-build.tar.gz" dist build
      - uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: ${{ runner.temp }}/release-build.tar.gz
          retention-days: 1
          compression-level: 0
          overwrite: true

  # `make test`, the modules split in two (SHARD=I/N of mk/test.mk), and the checks that need the CPU or the C test
  # programs, put where the time is short.
  tests-fast:
    name: fast tests (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/use-build
        with:
          artifact: release-build
          targets: dist/agentica build/vm/release/bootstrap/agentica vm-test-binaries
      - name: make test
        run: make test JOBS=6 SHARD=${{ matrix.shard }}/2
      - name: The TCP, TLS, HTTP, process and BDD modules with every VM on four schedulers
        if: matrix.shard == 2
        run: make test-multicore-modules
      - name: Filesystem removal regressions in Actions-owned scratch
        if: matrix.shard == 2
        run: make test-remove-actions
        env:
          AGENTICA_ACTIONS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      - if: matrix.shard == 1
        run: make vm-latency

  # The slow tier (make test-slow), the modules split in two: the first shard holds tests/test_vm_multicore.py, which takes
  # the longest by far. The second shard also runs the timing cases of Task.map, which need the CPU alone (so they come
  # after the tests, not beside them).
  tests-slow:
    name: slow tests (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/use-build
        with:
          artifact: release-build
          targets: dist/agentica build/vm/release/bootstrap/agentica vm-test-binaries
      - name: Slow tests
        run: make test-slow SHARD=${{ matrix.shard }}/2
      - run: make vm-task-map
        if: matrix.shard == 2

  tests-shared:
    name: shared-state locks
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/use-build
        with:
          artifact: release-build
          targets: dist/agentica build/vm/release/bootstrap/agentica vm-test-binaries
      - name: The binary tests again with the shared-state locks on
        run: make test-shared

  # The checks of the binary and the sources that are short each. The vendored check is the last build step: it rebuilds
  # build/vm/release/obj with other flags, so nothing that builds may run after it (here: only dup-check, which builds nothing).
  checks:
    name: C tests, BDD, layout, fixed point, JIT goldens, smoke, stage0, vendored libraries, copy-paste
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          npm-cache: 'true'
      - uses: ./.github/actions/use-build
        with:
          artifact: release-build
          targets: dist/agentica build/vm/release/bootstrap/agentica vm-test-binaries
      - name: Run the C tests, then the BDD specs on the Actions runner
        run: make -j"$(nproc)" vm-test test-bdd
        env:
          AGENTICA_ACTIONS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      # The loop of --jit off must not move silently (tools/layout_check.py). HEAD^1 is the base branch tip, so this compares
      # what the merge changes. An intended change carries the `layout-change` label, which accepts only the exit code 4 of
      # the check (build/layout-check.rc: make itself exits 2). The label is read here, not from the event, so adding it and
      # re-running the job is enough.
      - name: Layout of the --jit off hot loop against the base branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          rm -f build/layout-check.rc
          rc=0
          make -j"$(nproc)" layout-check BASE=HEAD^1 || rc=$?
          # The labels go to a variable first: `gh ... | grep -q` can kill gh with SIGPIPE under pipefail.
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name') || labels=
          if [ "$rc" -ne 0 ] && [ "$(cat build/layout-check.rc 2>/dev/null)" = 4 ] \
            && printf '%s\n' "$labels" | grep -qx layout-change; then
            echo "::warning title=layout-check::the loop of --jit off changed; the layout-change label accepts it"
            rc=0
          fi
          exit "$rc"
      - name: Fixed point of the front end from bootstrap/stage0.agcb (stage2 == stage3, the binary compiles stage2)
        run: make fixed-point
      - name: The goldens and their --max-steps sweeps with the JIT compiling every function it can, then half the golden shards with the JIT off
        run: make vm-jit-test
      - name: Example smoke runs
        run: make smoke
      - name: The layout of compiler/ and stdlib/ (agentica fmt --check)
        run: make fmt-check
      - name: Every file of compiler/ checks, line width and style rules included (agentica check compiler)
        run: make check-compiler
      # A PR that changes bootstrap/stage0.agcb must carry the stage2 that the base branch's stage0 builds from the PR's
      # compiler/. HEAD is the merge commit on pull_request, so HEAD^1 is the base tip. The sums go to the job summary.
      # It runs before the vendored check, which rebuilds the objects with other flags. When only this check failed, the
      # vendored steps still run (each needs the step before it to have passed), and the job stays red.
      - name: A changed bootstrap/stage0.agcb rebuilds from the stage0 of the base branch
        id: stage0
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- bootstrap/stage0.agcb; then
            echo "bootstrap/stage0.agcb is unchanged: nothing to check"
            exit 0
          fi
          git show HEAD^1:bootstrap/stage0.agcb > "$RUNNER_TEMP/base-stage0.agcb"
          rc=0
          make stage0-check BASE_STAGE0="$RUNNER_TEMP/base-stage0.agcb" || rc=$?
          {
            echo "### stage0 rebuild check: $([ "$rc" -eq 0 ] && echo passed || echo FAILED)"
            echo
            echo '```text'
            echo "built from the base stage0:  $(sha256sum build/stage-check/stage2.agcb 2>/dev/null | cut -d' ' -f1)"
            echo "bootstrap/stage0.agcb (PR):  $(sha256sum bootstrap/stage0.agcb | cut -d' ' -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - id: openssl_key
        if: ${{ !cancelled() && (success() || steps.stage0.outcome == 'failure') }}
        run: mkdir -p build && make -s vm-openssl-key AGENTICA_OPENSSL=vendored > build/openssl-key-release
      - id: vendored
        if: ${{ !cancelled() && (success() || steps.stage0.outcome == 'failure') && steps.openssl_key.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - if: ${{ !cancelled() && (success() || steps.stage0.outcome == 'failure') && steps.vendored.outcome == 'success' && steps.vendored.outputs.cache-hit != 'true' }}
        run: echo "::notice::Vendored OpenSSL check skipped - no cached release-mode OpenSSL for this key; warm-third-party checks it on master"
      - if: ${{ !cancelled() && (success() || steps.stage0.outcome == 'failure') && steps.vendored.outcome == 'success' && steps.vendored.outputs.cache-hit == 'true' }}
        run: make vendored-test
      - if: ${{ !cancelled() }}
        run: make dup-check

  # The check that branch protection names: every job of the Linux tests passed. A job that failed, was cancelled or did not
  # run fails it (none of them is skipped on a pull request or a manual run).
  test:
    needs: [build, tests-fast, tests-slow, tests-shared, checks]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the tests succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # The sanitizer half, only when C changed (the `changes` job). It builds in two jobs at once, so the shards below compile
  # nothing. `sanitizer-build` makes the sanitizer binary (dist/agentica with SANITIZE=1 and the stages it needs);
  # `tsan-build` makes the ThreadSanitizer and GC stress binaries and C tests. Their folders do not overlap, so a shard unpacks
  # both. Neither job switches mode after its first build: build/vm/flags (shared by the modes) then keeps the content that
  # its binaries were linked with, and make takes them as current (a switch would relink them and, through the first binary of
  # the bootstrap, run the stages again).
  sanitizer-build:
    needs: changes
    if: ${{ needs.changes.outputs.c != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENTICA_REQUIRE_VM: '1'
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
          sanitizers: 'true'
      - name: make vm-sanitize-build, the sanitizer binary and the front end stages it needs
        run: make -j"$(nproc)" vm-sanitize-build
      - run: GZIP=-1 tar -czf "$RUNNER_TEMP/sanitizer-build.tar.gz" dist build
      - uses: actions/upload-artifact@v7
        with:
          name: sanitizer-build
          path: ${{ runner.temp }}/sanitizer-build.tar.gz
          retention-days: 1
          compression-level: 0
          overwrite: true

  # The ThreadSanitizer binary and C tests and the GC stress binary and C tests, linked with the front end stages of a release
  # build (the stages are the same bytes in every mode; these two modes link the ones that exist, as mk/bootstrap.mk says).
  tsan-build:
    name: ThreadSanitizer and GC stress builds
    needs: changes
    if: ${{ needs.changes.outputs.c != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENTICA_REQUIRE_VM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
          sanitizers: 'true'
      - name: The front end stages that the TSan and GC stress binaries link
        run: make -j"$(nproc)" build/stage/stage2.agcb build/stage/runner.agcb build/stage/steps.agcb
      - name: vm-tsan, the threaded C tests under ThreadSanitizer (no libgc)
        run: make -j"$(nproc)" vm-tsan
      - name: Build the ThreadSanitizer binary of vm-tsan-run and the GC stress binary and C tests of vm-gc-stress (the shards run them)
        run: |
          make -j"$(nproc)" build/vm/tsan/agentica TSAN=1 SANITIZE=0 GC_STRESS=0
          make -j"$(nproc)" build/vm/gcstress/agentica vm-test-binaries GC_STRESS=1 SANITIZE=0
      - run: GZIP=-1 tar -czf "$RUNNER_TEMP/tsan-build.tar.gz" build/vm/tsan build/vm/gcstress
      - uses: actions/upload-artifact@v7
        with:
          name: tsan-build
          path: ${{ runner.temp }}/tsan-build.tar.gz
          retention-days: 1
          compression-level: 0
          overwrite: true

  # The sanitizer checks that build nothing the artifact has: the clang-tidy run (its own build of nothing), the build with
  # the trace points compiled out, and libFuzzer, which builds its own objects (and the sanitizer binary that compiles the
  # seeds) and needs the whole CPU for its 60 s.
  lint-fuzz:
    name: vm-lint, vm-trace-off, vm-libfuzz-run
    needs: changes
    if: ${{ needs.changes.outputs.c != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENTICA_REQUIRE_VM: '1'
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          sanitizers: 'true'
          clang-tidy: 'true'
      - name: make vm-lint
        run: make vm-lint CLANG_TIDY=clang-tidy-19
      - if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.trace == 'true' }}
        run: make vm-trace-off
      - name: vm-libfuzz-run, 60 s of libFuzzer (a crash, a JIT run that differs from the interpreter, a leak, RSS overrun or timeout fails it; the saved file reproduces it)
        if: ${{ !cancelled() }}
        run: make -j"$(nproc)" vm-libfuzz-run LIBFUZZ_TIME=60 LIBFUZZ_TIMEOUT=30 LIBFUZZ_JOBS="$(nproc)" LIBFUZZ_FLAGS=-seed=1
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: libfuzz-crashes
          path: build/vm/libfuzz/crashes/
          if-no-files-found: ignore

  # vm-sanitize-test, the modules split in two. The first shard also builds and runs the C tests and the fixed point of the
  # sanitizer binary; the second runs the GC stress goldens (the stress binary is in the tsan-build artifact).
  sanitizer-tests:
    name: vm-sanitize-test (${{ matrix.shard }}/2)
    needs: [changes, sanitizer-build, tsan-build]
    if: ${{ needs.changes.outputs.c != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          sanitizers: 'true'
      - uses: ./.github/actions/use-build
        with:
          artifact: sanitizer-build
          extra: tsan-build
          targets: dist/agentica
      - if: matrix.shard == 1
        run: make -j"$(nproc)" vm-test
      - name: Fixed point of the front end on the sanitizer binary (builds the dist/agentica that the next step tests)
        if: matrix.shard == 1
        run: make fixed-point
      - name: vm-sanitize-test, with tests/test_single_binary.py (the hand-off and run) on the sanitizer binary
        run: make vm-sanitize-test SHARD=${{ matrix.shard }}/2
      - if: matrix.shard == 2
        run: make -j"$(nproc)" vm-gc-stress JOBS=4

  # vm-tsan-run, the modules split in three (SHARD=I/N of mk/vm-test.mk). The ThreadSanitizer binary is linked again here,
  # because the sanitizer mode of the artifact and this mode share build/vm/flags; no object is compiled.
  tsan-run:
    name: vm-tsan-run (${{ matrix.shard }}/3)
    needs: [changes, sanitizer-build, tsan-build]
    if: ${{ needs.changes.outputs.c != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          sanitizers: 'true'
      - uses: ./.github/actions/use-build
        with:
          artifact: sanitizer-build
          extra: tsan-build
          targets: dist/agentica
      - name: vm-tsan-run, tests/test_vm_multicore.py and the TCP, TLS, HTTP, process and BDD modules on four schedulers under ThreadSanitizer
        run: make vm-tsan-run SHARD=${{ matrix.shard }}/3

  vm-layers:
    needs: [changes, sanitizer-build]
    if: ${{ needs.changes.outputs.c != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENTICA_REQUIRE_VM: '1'
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          tools: 'false'
          sanitizers: 'true'
      - uses: ./.github/actions/use-build
        with:
          artifact: sanitizer-build
          targets: dist/agentica
      - run: make vm-layers

  # The JIT on Linux ARM64 (#756), on an arm64 runner that builds its own binary: the C tests (code memory is mapped,
  # sealed and run there) and the goldens with AGENTICA_JIT=always, then half the shards with `off`. Until arm64 has an
  # emitter, every mode runs the interpreter.
  jit-arm64:
    needs: changes
    if: ${{ needs.changes.outputs.c != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - name: The C tests, building the VM from the sources
        run: make -j"$(nproc)" vm-test
      - name: The goldens and their --max-steps sweeps with AGENTICA_JIT=always, then half the golden shards with the JIT off
        run: make vm-jit-test

  # The check that branch protection names for the C half. It passes when C did not change (every job above is skipped then)
  # and fails when a job of the half failed or was cancelled.
  vm-sanitizers:
    needs: [changes, sanitizer-build, tsan-build, lint-fuzz, sanitizer-tests, tsan-run, vm-layers, jit-arm64]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the sanitizer half succeeded, or C did not change
        env:
          NEEDS: ${{ toJSON(needs) }}
          C: ${{ needs.changes.outputs.c }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "c=$C"
          printf '%s\n' "$NEEDS" | jq -e '.changes.result == "success"' > /dev/null
          if [ "$C" = false ]; then
            printf '%s\n' "$NEEDS" | jq -e '[to_entries[] | select(.key != "changes") | .value.result] | all(. == "skipped")' > /dev/null
          else
            printf '%s\n' "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
          fi
