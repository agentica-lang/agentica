name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      AGENTICA_REQUIRE_VM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - run: make vm vm-test
      - run: make vm-unicode && git diff --exit-code vm/unicode_data.c
      - run: make test
      - run: make test-bdd
      - run: AGENTICA_TEST_EXECUTABLE="$PWD/dist/agentica" raco test -j 2 tests/tcp-test.rkt tests/http-test.rkt tests/process-test.rkt tests/modules-test.rkt
      - run: racket src/main.rkt --allow-run examples/process-tool.agc
      - run: racket src/main.rkt examples/dispatch.agc
      - run: racket src/main.rkt examples/concurrency.agc
      - run: racket src/main.rkt examples/hello.agc
      - run: racket src/main.rkt examples/classify.agc
      - run: racket src/main.rkt examples/tasks.agc
      - run: racket src/main.rkt examples/inventory.agc
      - run: racket src/main.rkt examples/strings.agc
      - run: racket src/main.rkt examples/result.agc
      - run: racket src/main.rkt examples/blocks.agc
      - run: racket src/main.rkt examples/json.agc
      - run: dist/agentica examples/json-modules.agc
      - run: dist/agentica check examples/json-modules.agc
      - run: dist/agentica examples/queue.agc

  vm-sanitizers:
    runs-on: ubuntu-24.04
    env:
      AGENTICA_REQUIRE_VM: '1'
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - run: clang --version
      - run: make vm vm-test
      - run: make build
      - run: raco test tests/vm-diff-test.rkt tests/bytecode-test.rkt
      - run: make vm-fuzz
      - run: make vm-gc-stress

  vm-macos:
    runs-on: macos-15
    env:
      AGENTICA_REQUIRE_VM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - run: cc --version
      - run: make vm vm-test
      - run: make build
      - run: raco test tests/vm-diff-test.rkt tests/bytecode-test.rkt

  vm-windows:
    runs-on: windows-2025
    env:
      AGENTICA_REQUIRE_VM: '1'
      CC: gcc
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: make mingw-w64-ucrt-x86_64-gcc
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - run: gcc --version && echo '#include <stdio.h>' | gcc -std=c11 -D_POSIX_C_SOURCE=200809L -dM -E -x c - | sed -n '/MINGW_ANSI_STDIO\|define _UCRT/p'
      - run: make vm vm-test
      - run: gcc -std=c11 -D__USE_MINGW_ANSI_STDIO=0 -DAGC_NO_GC -DAGC_VERSION='"x"' -O2 -U NDEBUG -o ucrt-float.exe vm/value.c vm/text.c vm/unicode_data.c vm/loader.c vm/builtins.c vm/interp.c vm/diag.c vm/fuzz.c vm/tests/float_text_test.c && ./ucrt-float.exe
        continue-on-error: true
      - run: make build
      - run: raco test tests/vm-diff-test.rkt tests/bytecode-test.rkt
