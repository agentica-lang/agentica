name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - run: make test
      - run: make test-bdd
      - run: AGENTICA_TEST_EXECUTABLE="$PWD/dist/agentica" raco test -j 2 tests/tcp-test.rkt tests/http-test.rkt tests/process-test.rkt tests/modules-test.rkt
      - run: racket src/main.rkt --allow-run examples/process-tool.agc
      - run: racket src/main.rkt examples/dispatch.agc
      - run: racket src/main.rkt examples/concurrency.agc
      - run: racket src/main.rkt examples/hello.agc
      - run: racket src/main.rkt examples/classify.agc
      - run: racket src/main.rkt examples/tasks.agc
      - run: racket src/main.rkt examples/inventory.agc
      - run: racket src/main.rkt examples/strings.agc
      - run: racket src/main.rkt examples/result.agc
      - run: racket src/main.rkt examples/json.agc
      - run: dist/agentica examples/json-modules.agc
      - run: dist/agentica check examples/json-modules.agc
