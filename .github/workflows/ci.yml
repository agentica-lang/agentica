name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/platforms.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/site-examples.yml'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/platforms.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/site-examples.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'push'
    runs-on: [self-hosted, linux, docker-runner]
    outputs:
      vm: ${{ steps.vm.outputs.vm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: vm
        env:
          EVENT: ${{ github.event_name }}
        run: |
          vm=false
          if [ "$EVENT" != pull_request ]; then
            vm=true
          elif ! files=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD); then
            vm=true
          else
            while IFS= read -r f; do
              case "$f" in
                vm/*|src/lower.rkt|src/bytecode.rkt|src/version.rkt|tests/vm-diff-*|tests/cli-in-process.rkt|tests/bytecode-test.rkt|tests/fixtures/vm/*|Makefile|.gitmodules|.clang-tidy|.github/workflows/ci.yml)
                  vm=true ;;
              esac
            done <<< "$files"
          fi
          echo "vm=$vm"
          echo "vm=$vm" >> "$GITHUB_OUTPUT"

  warm-cache:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, docker-runner]
    steps:
      - uses: actions/checkout@v4
      - id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - uses: actions/cache@v4
        with:
          path: |
            src/compiled
            tests/compiled
          key: racket-zo-test-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
          restore-keys: racket-zo-test-9.3-
      - run: git ls-files -z | xargs -0 touch
      - run: make build && raco make -j 4 tests/*.rkt

  warm-unicode:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, docker-runner]
    steps:
      - uses: actions/checkout@v4
      - id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - run: mkdir -p build && sed -n '/^vm-unicode:/,/^$/p' Makefile > build/vm-unicode.mk
      - id: unicode
        uses: actions/cache@v4
        with:
          path: build/unicode-checked
          key: unicode-checked-9.3-${{ hashFiles('vm/tools/gen-unicode.rkt', 'vm/unicode_data.c', 'build/vm-unicode.mk') }}
      - if: steps.unicode.outputs.cache-hit != 'true'
        run: make vm-unicode && git diff --exit-code vm/unicode_data.c && touch build/unicode-checked

  test:
    if: github.event_name != 'push'
    runs-on: [self-hosted, linux, docker-runner]
    env:
      AGENTICA_REQUIRE_VM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - uses: actions/cache@v4
        with:
          path: |
            src/compiled
            tests/compiled
          key: racket-zo-${{ github.job }}-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
          restore-keys: racket-zo-${{ github.job }}-9.3-
      - run: git ls-files -z | xargs -0 touch
      - run: make build && raco make -j 4 tests/*.rkt
      - run: make vm vm-test
      - run: mkdir -p build && sed -n '/^vm-unicode:/,/^$/p' Makefile > build/vm-unicode.mk
      - id: unicode
        uses: actions/cache@v4
        with:
          path: build/unicode-checked
          key: unicode-checked-9.3-${{ hashFiles('vm/tools/gen-unicode.rkt', 'vm/unicode_data.c', 'build/vm-unicode.mk') }}
      - if: steps.unicode.outputs.cache-hit != 'true'
        run: make vm-unicode && git diff --exit-code vm/unicode_data.c && touch build/unicode-checked
      - run: make test
      - run: make test-bdd
      - run: AGENTICA_TEST_EXECUTABLE="$PWD/dist/agentica" raco test -j 2 tests/tcp-test.rkt tests/http-test.rkt tests/process-test.rkt tests/modules-test.rkt
      - run: racket src/main.rkt --allow-run examples/process-tool.agc
      - run: racket src/main.rkt examples/dispatch.agc
      - run: racket src/main.rkt examples/concurrency.agc
      - run: racket src/main.rkt examples/hello.agc
      - run: racket src/main.rkt examples/classify.agc
      - run: racket src/main.rkt examples/tasks.agc
      - run: racket src/main.rkt examples/inventory.agc
      - run: racket src/main.rkt examples/strings.agc
      - run: racket src/main.rkt examples/result.agc
      - run: racket src/main.rkt examples/blocks.agc
      - run: racket src/main.rkt examples/json.agc
      - run: dist/agentica examples/json-modules.agc
      - run: dist/agentica check examples/json-modules.agc
      - run: dist/agentica --vm examples/hello.agc
      - run: dist/agentica --vm examples/tasks.agc
      - run: diff <(dist/agentica examples/hello.agc) <(dist/agentica --vm examples/hello.agc)
        shell: bash
      - run: diff <(dist/agentica examples/tasks.agc) <(dist/agentica --vm examples/tasks.agc)
        shell: bash
      - run: dist/agentica examples/queue.agc

  vm-sanitizers:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.vm != 'false' }}
    runs-on: [self-hosted, linux, docker-runner]
    env:
      AGENTICA_REQUIRE_VM: '1'
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - uses: actions/cache@v4
        with:
          path: |
            src/compiled
            tests/compiled
          key: racket-zo-${{ github.job }}-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
          restore-keys: |
            racket-zo-test-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
            racket-zo-${{ github.job }}-9.3-
            racket-zo-test-9.3-
      - run: git ls-files -z | xargs -0 touch
      - run: clang --version
      - run: command -v clang-tidy || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-tidy; }
      - run: |
          clang-tidy --version
          major=$(clang-tidy --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)
          if [ -z "$major" ] || [ "$major" -lt 18 ]; then
            echo "clang-tidy ${major:-unknown} is too old: misc-use-internal-linkage needs clang-tidy 18 or newer" >&2
            exit 1
          fi
          make vm-lint
      - run: make vm vm-test
      - run: make build && raco make -j 4 tests/vm-diff-*-test.rkt tests/bytecode-test.rkt
      - run: raco test -j 4 tests/vm-diff-*-test.rkt tests/bytecode-test.rkt
      - run: make vm-fuzz
      - run: make vm-gc-stress
