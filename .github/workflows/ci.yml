name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/docs-site.yml'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/platforms.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      AGENTICA_REQUIRE_VM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - uses: actions/cache@v4
        with:
          path: |
            src/compiled
            tests/compiled
          key: racket-zo-${{ github.job }}-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
          restore-keys: racket-zo-${{ github.job }}-9.3-
      - run: git ls-files -z | xargs -0 touch
      - run: make build && raco make -j 4 tests/*.rkt
      - run: make vm vm-test
      - run: make vm-unicode && git diff --exit-code vm/unicode_data.c
      - run: make test
      - run: make test-bdd
      - run: AGENTICA_TEST_EXECUTABLE="$PWD/dist/agentica" raco test -j 2 tests/tcp-test.rkt tests/http-test.rkt tests/process-test.rkt tests/modules-test.rkt
      - run: racket src/main.rkt --allow-run examples/process-tool.agc
      - run: racket src/main.rkt examples/dispatch.agc
      - run: racket src/main.rkt examples/concurrency.agc
      - run: racket src/main.rkt examples/hello.agc
      - run: racket src/main.rkt examples/classify.agc
      - run: racket src/main.rkt examples/tasks.agc
      - run: racket src/main.rkt examples/inventory.agc
      - run: racket src/main.rkt examples/strings.agc
      - run: racket src/main.rkt examples/result.agc
      - run: racket src/main.rkt examples/blocks.agc
      - run: racket src/main.rkt examples/json.agc
      - run: dist/agentica examples/json-modules.agc
      - run: dist/agentica check examples/json-modules.agc
      - run: dist/agentica examples/queue.agc

  vm-sanitizers:
    runs-on: ubuntu-24.04
    env:
      AGENTICA_REQUIRE_VM: '1'
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - uses: actions/cache@v4
        with:
          path: |
            src/compiled
            tests/compiled
          key: racket-zo-${{ github.job }}-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
          restore-keys: racket-zo-${{ github.job }}-9.3-
      - run: git ls-files -z | xargs -0 touch
      - run: clang --version
      - run: make vm vm-test
      - run: make build && raco make -j 4 tests/vm-diff-test.rkt tests/bytecode-test.rkt
      - run: raco test tests/vm-diff-test.rkt tests/bytecode-test.rkt
      - run: make vm-fuzz
      - run: make vm-gc-stress
