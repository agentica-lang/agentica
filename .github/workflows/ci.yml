name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/platforms.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/site-examples.yml'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/platforms.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/site-examples.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'push'
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 10
    outputs:
      vm: ${{ steps.vm.outputs.vm }}
      trace: ${{ steps.vm.outputs.trace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: vm
        env:
          EVENT: ${{ github.event_name }}
        run: |
          vm=false
          trace=false
          if [ "$EVENT" != pull_request ]; then
            vm=true
            trace=true
          elif ! files=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD); then
            vm=true
            trace=true
          else
            while IFS= read -r f; do
              case "$f" in
                vm/trace.*|vm/tests/trace_test.c)
                  trace=true ;;
              esac
              case "$f" in
                vm/*|src/lower.rkt|src/bytecode.rkt|src/version.rkt|tests/vm-diff-*|tests/vm-trace-test.rkt|tests/vm-tcp-test.rkt|tests/fixtures/tcp-peer.js|tests/vm-tls-test.rkt|tests/fixtures/tls-peer.js|tests/fixtures/tls-peer.py|tests/fixtures/tls/*|tests/vm-http-test.rkt|tests/fixtures/http-*|stdlib/*|src/stdlib.rkt|tests/cli-in-process.rkt|tests/bytecode-test.rkt|tests/fixtures/vm/*|Makefile|.gitmodules|.clang-tidy|.github/workflows/ci.yml)
                  vm=true ;;
              esac
            done <<< "$files"
          fi
          echo "vm=$vm trace=$trace"
          echo "vm=$vm" >> "$GITHUB_OUTPUT"
          echo "trace=$trace" >> "$GITHUB_OUTPUT"

  warm-cache:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - uses: actions/cache@v4
        with:
          path: |
            src/compiled
            tests/compiled
          key: racket-zo-test-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
          restore-keys: racket-zo-test-9.3-
      - run: git ls-files -z | xargs -0 touch
      - run: make build && raco make -j 4 tests/*.rkt

  warm-unicode:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - run: mkdir -p build && sed -n '/^vm-unicode:/,/^$/p' Makefile > build/vm-unicode.mk
      - id: unicode
        uses: actions/cache@v4
        with:
          path: build/unicode-checked
          key: unicode-checked-9.3-${{ hashFiles('vm/tools/gen-unicode.rkt', 'vm/unicode_data.c', 'build/vm-unicode.mk') }}
      - if: steps.unicode.outputs.cache-hit != 'true'
        run: make vm-unicode && git diff --exit-code vm/unicode_data.c && touch build/unicode-checked

  warm-third-party:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: perl -MIPC::Cmd -MFile::Copy -e 1 2>/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends perl; }
      - run: mkdir -p build && make -s vm-openssl-key VM_OPENSSL=vendored > build/openssl-key-release
      - uses: actions/cache@v4
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - run: make vm-openssl VM_OPENSSL=vendored
      - run: command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config; }
      - run: |
          make -j"$(nproc)" build/vm/release/agentica-vm VM_OPENSSL=vendored
          if readelf -d build/vm/release/agentica-vm | grep -qE 'NEEDED.*lib(ssl|crypto)'; then echo "the vendored VM links OpenSSL dynamically" >&2; exit 1; fi
          ossl=$(awk -F= '/^(MAJOR|MINOR|PATCH)=/ { printf "%s%s", sep, $2; sep = "." }' vm/third_party/openssl/VERSION.dat)
          build/vm/release/agentica-vm --version | grep -qF "OpenSSL $ossl" || { echo "the vendored VM does not report OpenSSL $ossl" >&2; exit 1; }
      - run: mkdir -p build && make -s vm-third-party-key SANITIZE=1 > build/third-party-key-sanitize
      - uses: actions/cache@v4
        with:
          path: |
            build/vm/sanitize/uv
            build/vm/sanitize/libuv.a
            build/vm/sanitize/yyjson.o
            build/vm/sanitize/picohttpparser.o
            build/vm/sanitize/third-party-flags
          key: third-party-sanitize-${{ hashFiles('build/third-party-key-sanitize') }}
      - run: make -j"$(nproc)" vm-third-party SANITIZE=1
      - run: mkdir -p build && make -s vm-third-party-key GC_STRESS=1 > build/third-party-key-gcstress
      - uses: actions/cache@v4
        with:
          path: |
            build/vm/gcstress/uv
            build/vm/gcstress/libuv.a
            build/vm/gcstress/yyjson.o
            build/vm/gcstress/picohttpparser.o
            build/vm/gcstress/third-party-flags
            build/vm/gc.o
            build/vm/gc-flags
          key: third-party-gcstress-${{ hashFiles('build/third-party-key-gcstress') }}
      - run: make -j"$(nproc)" vm-third-party GC_STRESS=1

  dup-check:
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/jscpd/package-lock.json
      - run: make dup-check

  test:
    if: github.event_name != 'push'
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 45
    env:
      AGENTICA_REQUIRE_VM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - uses: actions/cache@v4
        with:
          path: |
            src/compiled
            tests/compiled
          key: racket-zo-${{ github.job }}-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
          restore-keys: racket-zo-${{ github.job }}-9.3-
      - run: git ls-files -z | xargs -0 touch
      - run: make build && raco make -j 4 tests/*.rkt
      - run: python3 --version
      - run: command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config; }
      - run: make vm vm-test
      - run: mkdir -p build && sed -n '/^vm-unicode:/,/^$/p' Makefile > build/vm-unicode.mk
      - id: unicode
        uses: actions/cache@v4
        with:
          path: build/unicode-checked
          key: unicode-checked-9.3-${{ hashFiles('vm/tools/gen-unicode.rkt', 'vm/unicode_data.c', 'build/vm-unicode.mk') }}
      - if: steps.unicode.outputs.cache-hit != 'true'
        run: make vm-unicode && git diff --exit-code vm/unicode_data.c && touch build/unicode-checked
      - run: make test
      - run: make vm-latency
      - run: make test-bdd
      - run: AGENTICA_TEST_EXECUTABLE="$PWD/dist/agentica" raco test -j 2 tests/process-test.rkt tests/modules-test.rkt
      - run: racket src/main.rkt --allow-run examples/process-tool.agc
      - run: racket src/main.rkt examples/dispatch.agc
      - run: racket src/main.rkt examples/concurrency.agc
      - run: racket src/main.rkt examples/hello.agc
      - run: racket src/main.rkt examples/classify.agc
      - run: racket src/main.rkt examples/tasks.agc
      - run: racket src/main.rkt examples/inventory.agc
      - run: racket src/main.rkt examples/strings.agc
      - run: racket src/main.rkt examples/result.agc
      - run: racket src/main.rkt examples/blocks.agc
      - run: racket src/main.rkt examples/json.agc
      - run: dist/agentica examples/json-modules.agc
      - run: dist/agentica check examples/json-modules.agc
      - run: dist/agentica examples/hello.agc
      - run: dist/agentica examples/tasks.agc
      - run: dist/agentica examples/file-summary.agc examples/hello.agc
      - run: dist/agentica --allow-run examples/process-tool.agc
      - run: diff <(dist/agentica --seed 7 tests/fixtures/vm/random.agc) <(dist/agentica --seed 7 tests/fixtures/vm/random.agc)
        shell: bash
      - run: dist/agentica examples/queue.agc
      - run: mkdir -p build && make -s vm-openssl-key VM_OPENSSL=vendored > build/openssl-key-release
      - id: vendored
        uses: actions/cache/restore@v4
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - if: steps.vendored.outputs.cache-hit == 'true'
        run: |
          make -j"$(nproc)" build/vm/release/agentica-vm VM_OPENSSL=vendored
          if readelf -d build/vm/release/agentica-vm | grep -qE 'NEEDED.*lib(ssl|crypto)'; then echo "the vendored VM links OpenSSL dynamically" >&2; exit 1; fi
          ossl=$(awk -F= '/^(MAJOR|MINOR|PATCH)=/ { printf "%s%s", sep, $2; sep = "." }' vm/third_party/openssl/VERSION.dat)
          build/vm/release/agentica-vm --version | grep -qF "OpenSSL $ossl" || { echo "the vendored VM does not report OpenSSL $ossl" >&2; exit 1; }
          AGENTICA_VM_BINARY=build/vm/release/agentica-vm raco test tests/vm-tls-test.rkt tests/vm-http-test.rkt

  vm-sanitizers:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.vm != 'false' }}
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 75
    env:
      AGENTICA_REQUIRE_VM: '1'
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - uses: actions/cache@v4
        with:
          path: |
            src/compiled
            tests/compiled
          key: racket-zo-${{ github.job }}-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
          restore-keys: |
            racket-zo-test-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
            racket-zo-${{ github.job }}-9.3-
            racket-zo-test-9.3-
      - run: git ls-files -z | xargs -0 touch
      - run: clang --version
      - run: python3 --version
      - run: command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config; }
      - run: mkdir -p build && make -s vm-third-party-key > build/third-party-key-sanitize
      - uses: actions/cache@v4
        with:
          path: |
            build/vm/sanitize/uv
            build/vm/sanitize/libuv.a
            build/vm/sanitize/yyjson.o
            build/vm/sanitize/picohttpparser.o
            build/vm/sanitize/third-party-flags
          key: third-party-sanitize-${{ hashFiles('build/third-party-key-sanitize') }}
      - run: mkdir -p build && make -s vm-third-party-key GC_STRESS=1 SANITIZE=0 > build/third-party-key-gcstress
      - uses: actions/cache@v4
        with:
          path: |
            build/vm/gcstress/uv
            build/vm/gcstress/libuv.a
            build/vm/gcstress/yyjson.o
            build/vm/gcstress/picohttpparser.o
            build/vm/gcstress/third-party-flags
            build/vm/gc.o
            build/vm/gc-flags
          key: third-party-gcstress-${{ hashFiles('build/third-party-key-gcstress') }}
      - run: command -v clang-tidy || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-tidy; }
      - run: |
          clang-tidy --version
          major=$(clang-tidy --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)
          if [ -z "$major" ] || [ "$major" -lt 19 ]; then
            echo "clang-tidy ${major:-unknown} is too old: misc-use-internal-linkage needs clang-tidy 19 or newer" >&2
            exit 1
          fi
          make vm-lint
      - if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.trace == 'true'
        run: |
          make -j"$(nproc)" vm vm-test TRACE=0
          dist/agentica-vm --version | grep -q 'trace off'
      - run: make -j"$(nproc)" vm vm-test
      - run: make build && raco make -j 4 tests/vm-diff-*-test.rkt tests/bytecode-test.rkt tests/vm-trace-test.rkt tests/vm-tcp-test.rkt tests/vm-tls-test.rkt tests/vm-http-test.rkt
      - run: raco test -j 4 tests/vm-diff-*-test.rkt tests/bytecode-test.rkt tests/vm-trace-test.rkt tests/vm-tcp-test.rkt tests/vm-tls-test.rkt tests/vm-http-test.rkt
      - run: make -j"$(nproc)" vm-fuzz
      - run: make -j"$(nproc)" vm-gc-stress
