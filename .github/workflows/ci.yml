name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/platforms.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/site-examples.yml'
      - '.github/workflows/sweep.yml'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/platforms.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/site-examples.yml'
      - '.github/workflows/sweep.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The runners can be slow (a capped CPU frequency): every deadline of the tests is multiplied by this, and so are the
# per-module limits of the Makefile (references/ci.md in the development skill has the three layers).
env:
  AGENTICA_TEST_TIMEOUT_SCALE: '4'

jobs:
  warm-unicode:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - run: mkdir -p build && sed -n '/^vm-unicode:/,/^$/p' Makefile > build/vm-unicode.mk
      - id: unicode
        uses: actions/cache@v4
        with:
          path: build/unicode-checked
          key: unicode-checked-9.3-${{ hashFiles('vm/tools/gen-unicode.rkt', 'vm/unicode_data.c', 'build/vm-unicode.mk') }}
      - if: steps.unicode.outputs.cache-hit != 'true'
        run: make vm-unicode-check

  warm-third-party:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 90
    env:
      AGENTICA_GC: vendored
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: perl -MIPC::Cmd -MFile::Copy -e 1 2>/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends perl; }
      - run: mkdir -p build && make -s vm-openssl-key AGENTICA_OPENSSL=vendored > build/openssl-key-release
      - uses: actions/cache@v4
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - run: make vm-openssl AGENTICA_OPENSSL=vendored
      - run: make vendored-check

  dup-check:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/jscpd/package-lock.json
      - run: make dup-check

  # The one job that still installs Racket: vm/unicode_data.c is generated by vm/tools/gen-unicode.rkt from Racket's
  # Unicode tables. warm-unicode fills the marker on master, so a pull request installs Racket only when the generator or
  # the table changed. The job goes when the generator is ported.
  unicode:
    if: github.event_name != 'push'
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build && sed -n '/^vm-unicode:/,/^$/p' Makefile > build/vm-unicode.mk
      - id: unicode
        uses: actions/cache@v4
        with:
          path: build/unicode-checked
          key: unicode-checked-9.3-${{ hashFiles('vm/tools/gen-unicode.rkt', 'vm/unicode_data.c', 'build/vm-unicode.mk') }}
      - if: steps.unicode.outputs.cache-hit != 'true'
        id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.unicode.outputs.cache-hit != 'true' && steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - if: steps.unicode.outputs.cache-hit != 'true'
        run: make vm-unicode-check

  test:
    if: github.event_name != 'push'
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 150
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
    outputs:
      vm: ${{ steps.changes.outputs.vm }}
      trace: ${{ steps.changes.outputs.trace }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 2
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          vm=false
          trace=false
          if [ "$EVENT" != pull_request ]; then
            vm=true
            trace=true
          elif ! files=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD); then
            vm=true
            trace=true
          else
            while IFS= read -r f; do
              case "$f" in
                vm/trace.*|vm/tests/trace_test.c)
                  trace=true ;;
              esac
              case "$f" in
                vm/*|bootstrap/*|compiler/front_end*|compiler/lower*|compiler/bytecode*|VERSION|tests/test_vm_diff_*|tests/vm_diff_support.py|tests/test_vm_trace.py|tests/test_vm_tcp.py|tests/fixtures/tcp-peer.js|tests/test_vm_tls.py|tests/fixtures/tls-peer.js|tests/fixtures/tls-peer.py|tests/fixtures/tls/*|tests/test_vm_http.py|tests/fixtures/http-*|tests/test_vm_test_protocol.py|tests/fixtures/test-protocol-peer.*|tests/test_vm_child_channel.py|tests/fixtures/child-channel*|tests/fixtures/child_channel.py|tests/fixtures/channel-run.py|tests/test_vm_stop.py|tests/fixtures/stop-peer.py|tests/test_vm_channel.py|tests/fixtures/channel-peer.py|tests/test_vm_stdout.py|tests/fixtures/stdout-peer.py|tests/test_vm_logger.py|tests/fixtures/logger-peer.*|tests/test_vm_monotonic.py|tests/fixtures/monotonic-peer.*|tests/test_vm_file_lines.py|tests/fixtures/lines-peer.py|tests/test_vm_os.py|tests/test_vm_stack.py|tests/agentica_test.py|stdlib/*|tests/fixtures/vm/*|Makefile|.gitmodules|.clang-tidy|.github/workflows/ci.yml)
                  vm=true ;;
              esac
            done <<< "$files"
          fi
          echo "vm=$vm trace=$trace"
          echo "vm=$vm" >> "$GITHUB_OUTPUT"
          echo "trace=$trace" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/jscpd/package-lock.json
      - run: |
          python3 --version
          command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl && pkg-config --atleast-version=8.2.0 bdw-gc || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libgc-dev pkg-config; }
      - name: Build the binary from bootstrap/stage0.agcb, the C tests, and the BDD specs on the binary
        run: make -j"$(nproc)" vm-test test-bdd
      - name: make test
        run: make test JOBS=6
      - name: Fixed point of the front end from bootstrap/stage0.agcb (stage2 == stage3, the binary compiles stage2)
        run: make fixed-point
      - name: The product command line tests on the single binary
        run: make test-cli
      - name: Slow tests
        run: make test-slow
      - run: make vm-latency
      - name: Example smoke runs
        run: make smoke
      - run: mkdir -p build && make -s vm-openssl-key AGENTICA_OPENSSL=vendored > build/openssl-key-release
      - id: vendored
        uses: actions/cache/restore@v4
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - if: steps.vendored.outputs.cache-hit != 'true'
        run: echo "::notice::Vendored OpenSSL check skipped - no cached release-mode OpenSSL for this key; warm-third-party checks it on master"
      - if: steps.vendored.outputs.cache-hit == 'true'
        run: make vendored-test
      - if: ${{ !cancelled() }}
        run: make dup-check

  vm-sanitizers:
    needs: test
    if: ${{ !cancelled() && github.event_name != 'push' && needs.test.outputs.vm != 'false' }}
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 150
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          clang --version
          python3 --version
          command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl && pkg-config --atleast-version=8.2.0 bdw-gc || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libgc-dev pkg-config; }
          command -v clang-tidy || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-tidy; }
          command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep; }
      - name: make vm-lint
        run: make vm-lint
      - if: github.event_name == 'workflow_dispatch' || needs.test.outputs.trace == 'true'
        run: make vm-trace-off
      - run: make -j"$(nproc)" vm-test vm-fuzz
      - if: ${{ !cancelled() }}
        run: make vm-layers
      - if: ${{ !cancelled() }}
        run: make vm-sanitize-build
      - name: Fixed point of the front end on the sanitizer binary (builds the dist/agentica that the next step tests)
        if: ${{ !cancelled() }}
        run: make fixed-point
      - name: vm-sanitize-test, with tests/test_single_binary.py (the hand-off and run) on the sanitizer binary
        if: ${{ !cancelled() }}
        run: make vm-sanitize-test
      - run: make -j"$(nproc)" vm-gc-stress JOBS=4
