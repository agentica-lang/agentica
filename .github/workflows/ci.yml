name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/platforms.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/site-examples.yml'
      - '.github/workflows/sweep.yml'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/fuzz.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/platforms.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/site-examples.yml'
      - '.github/workflows/sweep.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The runners can be slow (a capped CPU frequency): every deadline of the tests is multiplied by this, and so are the
# per-module limits of the Makefile (references/ci.md in the development skill has the three layers).
env:
  AGENTICA_TEST_TIMEOUT_SCALE: '4'

jobs:
  warm-third-party:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGENTICA_GC: vendored
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: perl -MIPC::Cmd -MFile::Copy -e 1 2>/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends perl; }
      - run: mkdir -p build && make -s vm-openssl-key AGENTICA_OPENSSL=vendored > build/openssl-key-release
      - uses: actions/cache@v6
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - run: make vm-openssl AGENTICA_OPENSSL=vendored
      - run: make vendored-check

  dup-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/jscpd/package-lock.json
      - run: make dup-check

  test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
    outputs:
      vm: ${{ steps.changes.outputs.vm }}
      trace: ${{ steps.changes.outputs.trace }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 2
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          vm=false
          trace=false
          if [ "$EVENT" != pull_request ]; then
            vm=true
            trace=true
          elif ! files=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD); then
            vm=true
            trace=true
          else
            while IFS= read -r f; do
              case "$f" in
                vm/trace.*|vm/tests/trace_test.c)
                  trace=true ;;
              esac
              case "$f" in
                vm/*|bootstrap/*|compiler/front_end*|compiler/lower*|compiler/bytecode*|VERSION|tests/test_vm_diff_*|tests/vm_diff_support.py|tests/test_vm_trace.py|tests/test_vm_tcp.py|tests/fixtures/tcp-peer.js|tests/test_vm_tls.py|tests/fixtures/tls-peer.js|tests/fixtures/tls-peer.py|tests/fixtures/tls/*|tests/test_vm_http.py|tests/fixtures/http-*|tests/test_vm_test_protocol.py|tests/fixtures/test-protocol-peer.*|tests/test_vm_child_channel.py|tests/fixtures/child-channel*|tests/fixtures/child_channel.py|tests/fixtures/channel-run.py|tests/test_vm_stop.py|tests/fixtures/stop-peer.py|tests/test_vm_channel.py|tests/fixtures/channel-peer.py|tests/test_vm_task_map.py|tests/test_vm_stdout.py|tests/fixtures/stdout-peer.py|tests/test_vm_logger.py|tests/fixtures/logger-peer.*|tests/test_vm_monotonic.py|tests/fixtures/monotonic-peer.*|tests/test_vm_file_lines.py|tests/fixtures/lines-peer.py|tests/test_vm_os.py|tests/test_vm_stack.py|tests/agentica_test.py|stdlib/*|tests/fixtures/vm/*|Makefile|.gitmodules|.clang-tidy|.github/workflows/ci.yml)
                  vm=true ;;
              esac
            done <<< "$files"
          fi
          echo "vm=$vm trace=$trace"
          echo "vm=$vm" >> "$GITHUB_OUTPUT"
          echo "trace=$trace" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/jscpd/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install poetry==2.1.2
      - run: poetry install --only test --no-root
      - run: |
          python3 --version
          command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl && pkg-config --atleast-version=8.2.0 bdw-gc || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libgc-dev pkg-config; }
      - name: Build the binary and C tests, then run the BDD specs on the Actions runner
        run: make -j"$(nproc)" vm-test test-bdd
        env:
          AGENTICA_ACTIONS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      - name: Filesystem removal regressions in Actions-owned scratch
        run: make test-remove-actions
        env:
          AGENTICA_ACTIONS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      - name: make test
        run: make test JOBS=6
      - name: Fixed point of the front end from bootstrap/stage0.agcb (stage2 == stage3, the binary compiles stage2)
        run: make fixed-point
      - name: The product command line tests on the single binary
        run: make test-cli
      - name: Slow tests
        run: make test-slow
      - run: make vm-latency
      - run: make vm-task-map
      - name: Example smoke runs
        run: make smoke
      - run: mkdir -p build && make -s vm-openssl-key AGENTICA_OPENSSL=vendored > build/openssl-key-release
      - id: vendored
        uses: actions/cache/restore@v6
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - if: steps.vendored.outputs.cache-hit != 'true'
        run: echo "::notice::Vendored OpenSSL check skipped - no cached release-mode OpenSSL for this key; warm-third-party checks it on master"
      - if: steps.vendored.outputs.cache-hit == 'true'
        run: make vendored-test
      - if: ${{ !cancelled() }}
        run: make dup-check

  vm-sanitizers:
    needs: test
    if: ${{ !cancelled() && github.event_name != 'push' && needs.test.outputs.vm != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
      SANITIZE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          clang --version
          python3 --version
          command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl && pkg-config --atleast-version=8.2.0 bdw-gc || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libgc-dev pkg-config; }
          command -v clang-tidy-19 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-tidy-19; }
          command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep; }
      - name: make vm-lint
        run: make vm-lint CLANG_TIDY=clang-tidy-19
      - if: github.event_name == 'workflow_dispatch' || needs.test.outputs.trace == 'true'
        run: make vm-trace-off
      - run: make -j"$(nproc)" vm-test vm-fuzz
      - if: ${{ !cancelled() }}
        run: make vm-layers
      - if: ${{ !cancelled() }}
        run: make vm-sanitize-build
      - name: Fixed point of the front end on the sanitizer binary (builds the dist/agentica that the next step tests)
        if: ${{ !cancelled() }}
        run: make fixed-point
      - name: vm-sanitize-test, with tests/test_single_binary.py (the hand-off and run) on the sanitizer binary
        if: ${{ !cancelled() }}
        run: make vm-sanitize-test
      - run: make -j"$(nproc)" vm-gc-stress JOBS=4
