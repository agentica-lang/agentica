name: Release

# Four native packages (docs: references/ci.md of the development skill):
#   linux-x86_64    ubuntu-latest   pinned zig cc against glibc 2.28           .tar.gz
#   windows-x86_64  windows-2025    MSYS2 UCRT64 GCC                           .zip
#   macos-x86_64    macos-15-intel  Apple clang, MACOSX_DEPLOYMENT_TARGET      .tar.gz
#   macos-arm64     macos-latest    Apple clang, MACOSX_DEPLOYMENT_TARGET      .tar.gz
# A tag push publishes them with SHA256SUMS once all four build and pass the tests of their extracted package; a manual
# run (workflow_dispatch) only uploads the same files as artifacts.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version
        id: version
        run: |
          version=$(make -s version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" == "$version" ]] || {
              echo "Tag $GITHUB_REF_NAME must match the VERSION file $version" >&2
              exit 1
            }
          fi

  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZIG_VERSION: 0.15.2
      ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
      VM_GLIBC: '2.28'
      AGENTICA_OPENSSL: vendored
      AGENTICA_GC: vendored
      CCACHE: ''
      RELEASE_PLATFORM: linux-x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install poetry==2.1.2
      - run: poetry install --only test --no-root
      - id: zig
        run: |
          dir="$RUNNER_TOOL_CACHE/zig-$ZIG_VERSION"
          if [ ! -x "$dir/zig" ] || [ "$(cat "$dir.sha256" 2>/dev/null)" != "$ZIG_SHA256" ]; then
            archive="$RUNNER_TEMP/zig.tar.xz"
            curl -sSfL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$archive"
            echo "$ZIG_SHA256  $archive" | sha256sum -c
            rm -rf "$dir.tmp" "$dir" "$dir.sha256"
            mkdir -p "$dir.tmp"
            tar -xJf "$archive" -C "$dir.tmp" --strip-components=1
            mv "$dir.tmp" "$dir"
            echo "$ZIG_SHA256" > "$dir.sha256"
            rm "$archive"
          fi
          echo "CC=$dir/zig cc -target x86_64-linux-gnu.$VM_GLIBC" >> "$GITHUB_ENV"
      - run: perl -MIPC::Cmd -MFile::Copy -e 1 2>/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends perl; }
      - name: Build the binary against glibc ${{ env.VM_GLIBC }}
        run: |
          # From bootstrap/stage0.agcb with zig cc: the embedding (.incbin in a generated assembly file) and the link
          # have to work with this toolchain and glibc ${{ env.VM_GLIBC }}, which PR CI (gcc) does not use. The fixed point
          # also checks that the binary compiles the front end to the same bytes.
          make vm-test fixed-point CCACHE=
          [ "$(dist/agentica --version)" = "${{ needs.version.outputs.version }}" ]
          strip dist/agentica
      - name: Check the ELF binary
        run: make release-check
      - name: Golden tests on the release binary
        env:
          AGENTICA_REQUIRE_VM: '1'
          AGENTICA_SWEEP: full
        run: |
          python3 --version
          make vm-diff-test JOBS=4
      - name: Smoke-test
        run: |
          ./dist/agentica examples/hello.agc
          ./dist/agentica --version
          ./dist/agentica examples/queue.agc
          make test-distribution
      - name: Package the binary
        run: make release-package
      - name: Test the extracted package
        run: make release-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: agentica-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # The link target of the binary: clang reads it from the environment and the linker writes it as `minos`, which
      # tools/release-check.sh compares. It does not prove that every object or API is safe on macOS 12, and CI does not
      # run macOS 12.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      AGENTICA_OPENSSL: vendored
      AGENTICA_GC: vendored
      CCACHE: ''
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: brew install make
      - run: |
          cc --version
          uname -m
      - name: Build the binary
        run: |
          gmake vm-test fixed-point
          [ "$(dist/agentica --version)" = "${{ needs.version.outputs.version }}" ]
          # strip removes the linker's signature, and an arm64 binary without one does not start: sign it ad hoc. This
          # is not a Developer ID signature and not notarization (both need credentials).
          strip -x dist/agentica
          codesign --force --sign - dist/agentica
      - name: Check the Mach-O binary
        run: gmake release-check
      - name: Smoke-test
        run: |
          ./dist/agentica examples/hello.agc
          ./dist/agentica --version
      - name: Package the binary
        run: gmake release-package
      - name: Test the extracted package
        run: gmake release-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: agentica-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      AGENTICA_OPENSSL: vendored
      AGENTICA_GC: vendored
      CCACHE: ''
      RELEASE_PLATFORM: windows-x86_64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: make perl mingw-w64-ucrt-x86_64-gcc
      - run: test "$(command -v gcc)" = /ucrt64/bin/gcc && gcc --version
      - name: Build the binary
        run: |
          make vm-test fixed-point
          [ "$(dist/agentica.exe --version)" = "${{ needs.version.outputs.version }}" ]
          strip dist/agentica.exe
      - name: Check the PE binary
        run: make release-check
      - name: Smoke-test
        run: |
          ./dist/agentica.exe examples/hello.agc
          ./dist/agentica.exe --version
      - name: Package the binary
        run: make release-package PYTHON=python
      - name: Test the extracted package
        # The smoke test gives the package a PATH of the Windows folders only, so a DLL that exists only in MSYS2 shows.
        run: make release-smoke PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: agentica-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  collect:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: agentica-*
          path: artifacts
      - name: Check that the four archives are there, once each, and write SHA256SUMS
        run: python3 -I tools/release.py collect --in artifacts --out release
      - uses: actions/upload-artifact@v4
        with:
          name: release-sha256sums
          path: release/SHA256SUMS
          if-no-files-found: error

  publish:
    # Only a tag push publishes; `version` has checked that the tag is the VERSION file.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # gh uses GH_TOKEN
      - uses: actions/download-artifact@v4
        with:
          pattern: agentica-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: release-sha256sums
          path: sums
      - name: Gather the release files
        run: |
          python3 -I tools/release.py collect --in artifacts --out release
          diff sums/SHA256SUMS release/SHA256SUMS
          (cd release && sha256sum -c SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a `-` (0.4.1-beta.1) is a SemVer pre-release.
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "" --draft "${flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
