name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, docker-runner]
    steps:
      - uses: actions/checkout@v4
      - id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - name: Validate release version
        id: version
        run: |
          version=$(make -s version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" == "$version" ]] || {
              echo "Tag $GITHUB_REF_NAME must match src/version.rkt version $version" >&2
              exit 1
            }
          fi
      - name: Build and smoke-test
        run: |
          make exe
          ./dist/agentica examples/hello.agc
          ./dist/agentica --version
          ./dist/agentica examples/queue.agc
          raco test tests/stdlib-distribution-test.rkt
      - name: Package distributed executable
        run: |
          name="agentica-${{ steps.version.outputs.version }}-linux-x86_64"
          raco distribute "dist/$name" dist/agentica
          "./dist/$name/bin/agentica" examples/hello.agc
          "./dist/$name/bin/agentica" --version
          "./dist/$name/bin/agentica" examples/queue.agc
          cp LICENSE NOTICE "dist/$name/"
          share=$(racket -e '(require setup/dirs) (display (find-share-dir))')
          mkdir -p "dist/$name/licenses/racket"
          cp "$share/LICENSE.txt" "$share/LICENSE-MIT.txt" "$share/LICENSE-APACHE.txt" \
            licenses/racket/ChezScheme-NOTICE "dist/$name/licenses/racket/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          listing=$(tar -tzf "dist/$name.tar.gz")
          for f in LICENSE NOTICE licenses/racket/LICENSE.txt licenses/racket/LICENSE-MIT.txt \
            licenses/racket/LICENSE-APACHE.txt licenses/racket/ChezScheme-NOTICE; do
            grep -qxF "$name/$f" <<< "$listing" || { echo "$name.tar.gz lacks $name/$f" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: agentica-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: [self-hosted, linux, docker-runner]
    permissions:
      contents: write
    steps:
      - name: Install GitHub CLI
        run: |
          command -v gh || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gh; }
          rm -rf dist
      - uses: actions/download-artifact@v4
        with:
          pattern: agentica-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum agentica-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
