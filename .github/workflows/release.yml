name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
      - name: Validate release version
        id: version
        run: |
          version=$(make -s version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" == "$version" ]] || {
              echo "Tag $GITHUB_REF_NAME must match src/version.rkt version $version" >&2
              exit 1
            }
          fi
      - name: Build and smoke-test
        run: |
          make exe
          ./dist/agentica examples/hello.agc
          ./dist/agentica --version
          ./dist/agentica examples/queue.agc
          raco test tests/stdlib-distribution-test.rkt
      - name: Package distributed executable
        run: |
          name="agentica-${{ steps.version.outputs.version }}-linux-x86_64"
          raco distribute "dist/$name" dist/agentica
          "./dist/$name/bin/agentica" examples/hello.agc
          "./dist/$name/bin/agentica" --version
          "./dist/$name/bin/agentica" examples/queue.agc
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          tar -tzf "dist/$name.tar.gz" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: agentica-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agentica-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum agentica-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
