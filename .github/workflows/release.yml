name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, docker-runner]
    env:
      ZIG_VERSION: 0.15.2
      ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
      VM_GLIBC: '2.28'
      AGENTICA_OPENSSL: vendored
      AGENTICA_GC: vendored
      CCACHE: ''
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Validate release version
        id: version
        run: |
          version=$(make -s version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" == "$version" ]] || {
              echo "Tag $GITHUB_REF_NAME must match the VERSION file $version" >&2
              exit 1
            }
          fi
      - id: zig
        run: |
          dir="$RUNNER_TOOL_CACHE/zig-$ZIG_VERSION"
          if [ ! -x "$dir/zig" ] || [ "$(cat "$dir.sha256" 2>/dev/null)" != "$ZIG_SHA256" ]; then
            archive="$RUNNER_TEMP/zig.tar.xz"
            curl -sSfL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$archive"
            echo "$ZIG_SHA256  $archive" | sha256sum -c
            rm -rf "$dir.tmp" "$dir" "$dir.sha256"
            mkdir -p "$dir.tmp"
            tar -xJf "$archive" -C "$dir.tmp" --strip-components=1
            mv "$dir.tmp" "$dir"
            echo "$ZIG_SHA256" > "$dir.sha256"
            rm "$archive"
          fi
          echo "CC=$dir/zig cc -target x86_64-linux-gnu.$VM_GLIBC" >> "$GITHUB_ENV"
      - run: perl -MIPC::Cmd -MFile::Copy -e 1 2>/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends perl; }
      - name: Build the binary against glibc ${{ env.VM_GLIBC }}
        run: |
          set -o pipefail
          # From bootstrap/stage0.agcb with zig cc: the embedding (.incbin in a generated assembly file) and the link
          # have to work with this toolchain and glibc ${{ env.VM_GLIBC }}, which PR CI (gcc) does not use. The fixed point
          # also checks that the binary compiles the front end to the same bytes.
          make vm-test fixed-point CCACHE=
          [ "$(dist/agentica --version)" = "${{ steps.version.outputs.version }}" ]
          strip dist/agentica
          sections=$(LC_ALL=C readelf -SW dist/agentica)
          if grep -qE '[.](debug_info|symtab)[[:space:]]' <<< "$sections"; then
            echo "dist/agentica still has .debug_info or .symtab after strip" >&2
            exit 1
          fi
          # grep finds nothing when objdump prints no versions: `|| true` keeps pipefail from ending the step before the
          # message below.
          newest=$({ objdump -T dist/agentica | grep -o 'GLIBC_[0-9.]*' || true; } | sort -uV | tail -n 1)
          [ -n "$newest" ] || { echo "objdump found no GLIBC symbol versions in dist/agentica" >&2; exit 1; }
          echo "dist/agentica needs $newest"
          [ "$(printf '%s\n' "$newest" "GLIBC_$VM_GLIBC" | sort -V | tail -n 1)" = "GLIBC_$VM_GLIBC" ] || {
            echo "dist/agentica needs $newest, newer than GLIBC_$VM_GLIBC" >&2
            exit 1
          }
          export LC_ALL=C
          header=$(readelf -h dist/agentica)
          dynamic=$(readelf -d dist/agentica)
          segments=$(readelf -lW dist/agentica)
          symbols=$(objdump -T dist/agentica)
          grep -q 'Type:[[:space:]]*DYN' <<< "$header" || { echo "dist/agentica is not PIE" >&2; exit 1; }
          if grep -qE 'NEEDED.*lib(ssl|crypto)' <<< "$dynamic"; then echo "dist/agentica links OpenSSL dynamically" >&2; exit 1; fi
          if grep -qE 'NEEDED.*libgc[.]' <<< "$dynamic"; then echo "dist/agentica links libgc dynamically" >&2; exit 1; fi
          ossl=$(awk -F= '/^(MAJOR|MINOR|PATCH)=/ { printf "%s%s", sep, $2; sep = "." }' vm/third_party/openssl/VERSION.dat)
          dist/agentica run --version | grep -qF "OpenSSL $ossl" || { echo "dist/agentica does not report the vendored OpenSSL $ossl" >&2; exit 1; }
          grep -q 'FLAGS_1).*PIE' <<< "$dynamic" || { echo "dist/agentica is not PIE" >&2; exit 1; }
          grep -q '(FLAGS).*BIND_NOW' <<< "$dynamic" || { echo "dist/agentica lacks BIND_NOW" >&2; exit 1; }
          grep -q 'GNU_RELRO' <<< "$segments" || { echo "dist/agentica lacks RELRO" >&2; exit 1; }
          grep -q '__stack_chk_fail' <<< "$symbols" || { echo "dist/agentica lacks the stack protector" >&2; exit 1; }
          grep -qE '__(memcpy|read|vsnprintf)_chk' <<< "$symbols" || { echo "dist/agentica lacks _FORTIFY_SOURCE" >&2; exit 1; }
      - name: Golden tests on the release binary
        env:
          AGENTICA_REQUIRE_VM: '1'
          AGENTICA_SWEEP: full
        run: |
          python3 --version
          make vm-diff-test JOBS=4
      - name: Smoke-test
        run: |
          ./dist/agentica examples/hello.agc
          ./dist/agentica --version
          ./dist/agentica examples/queue.agc
          make test-distribution
      - name: Package the binary
        run: |
          name="agentica-${{ steps.version.outputs.version }}-linux-x86_64"
          mkdir -p "dist/$name/bin"
          cp dist/agentica "dist/$name/bin/"
          cp LICENSE NOTICE "dist/$name/"
          mkdir -p "dist/$name/licenses/"{bdwgc,libuv,yyjson,picohttpparser,openssl,unicode}
          sed -n '1,/covered by the GPL\./p' vm/third_party/bdwgc/README.QUICK > "dist/$name/licenses/bdwgc/NOTICE"
          cp vm/third_party/libuv/LICENSE vm/third_party/libuv/LICENSE-extra "dist/$name/licenses/libuv/"
          cp vm/third_party/yyjson/LICENSE "dist/$name/licenses/yyjson/"
          sed -n '1,/^ \*\//p' vm/third_party/picohttpparser/picohttpparser.h > "dist/$name/licenses/picohttpparser/LICENSE"
          cp vm/third_party/openssl/LICENSE.txt "dist/$name/licenses/openssl/"
          cp licenses/unicode/LICENSE.txt "dist/$name/licenses/unicode/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          listing=$(tar -tzf "dist/$name.tar.gz")
          for f in bin/agentica LICENSE NOTICE licenses/bdwgc/NOTICE \
            licenses/libuv/LICENSE licenses/libuv/LICENSE-extra licenses/yyjson/LICENSE licenses/picohttpparser/LICENSE licenses/openssl/LICENSE.txt licenses/unicode/LICENSE.txt; do
            grep -qxF "$name/$f" <<< "$listing" || { echo "$name.tar.gz lacks $name/$f" >&2; exit 1; }
          done
          # One program: nothing else in bin/.
          [ "$(grep -c "^$name/bin/[^/]" <<< "$listing")" = 1 ] || { echo "$name.tar.gz has more than bin/agentica in bin/" >&2; exit 1; }
          unpacked="$RUNNER_TEMP/unpacked"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          tar -xzf "dist/$name.tar.gz" -C "$unpacked"
          agentica="$unpacked/$name/bin/agentica"
          "$agentica" examples/hello.agc
          "$agentica" --version
          if LC_ALL=C readelf -d "$agentica" | grep -qE 'NEEDED.*lib(ssl|crypto|gc)[.]'; then echo "the archive's agentica links OpenSSL or libgc dynamically" >&2; exit 1; fi
          "$agentica" examples/queue.agc
          "$agentica" compile examples/hello.agc -o "$unpacked/hello.agcb"
          "$agentica" run -- "$unpacked/hello.agcb"
          "$agentica" test tests/bdd/specs/ --steps tests/bdd/handlers.agc
          diff <("$agentica" --seed 7 tests/fixtures/vm/random.agc) <("$agentica" --seed 7 tests/fixtures/vm/random.agc)
          rm -rf "$unpacked"
      - uses: actions/upload-artifact@v4
        with:
          name: agentica-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: [self-hosted, linux, docker-runner]
    permissions:
      contents: write
    steps:
      - name: Install GitHub CLI
        run: |
          command -v gh || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gh; }
          rm -rf dist
      - uses: actions/download-artifact@v4
        with:
          pattern: agentica-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum agentica-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "" --draft
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
