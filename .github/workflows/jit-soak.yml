name: JIT on soak

# The evidence for making `--jit on` the default (docs/future/22-jit.md §22): every day, the Python tests of each system
# (the conformance areas of platforms.yml, plus the destructive group) run with AGENTICA_JIT=on in the environment of
# every VM they start, on the four systems. `on` must change no exit code, output or diagnostic, so any failure is a JIT
# bug or a test that depends on the mode. While the emitter is x86-64 only, `on` falls back to the interpreter on macOS
# arm64, and that job only shows that the setting is harmless. A failure fails the job, and the report in the job
# summary names the failed cases. Not on pull requests, so their CI time does not change; run it by hand on a branch with
# `gh workflow run jit-soak.yml --ref BRANCH`. A manual run never cancels the scheduled one (cancel-in-progress: false).
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AGENTICA_TEST_TIMEOUT_SCALE: '4'

jobs:
  soak:
    name: jit on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            make: make
            python: python3
            shell: bash
          - platform: windows-x86_64
            runner: windows-2025
            make: make
            python: python
            shell: msys2 {0}
          - platform: macos-x86_64
            runner: macos-15-intel
            make: gmake
            python: python3
            shell: bash
          - platform: macos-arm64
            runner: macos-latest
            make: gmake
            python: python3
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      AGENTICA_REQUIRE_VM: '1'
      # The same linkage as platforms.yml: system libraries on Linux, the vendored ones elsewhere (as the release does).
      AGENTICA_OPENSSL: ${{ matrix.platform == 'linux-x86_64' && 'system' || 'vendored' }}
      AGENTICA_ZLIB: ${{ matrix.platform == 'linux-x86_64' && 'system' || 'vendored' }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      PYTHON: ${{ matrix.python }}
      PLATFORM: ${{ matrix.platform }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python3 -m pip install poetry==2.1.2 && poetry install --only test --no-root
        if: runner.os != 'Windows'
      - run: python -m pip install poetry==2.1.2
        if: runner.os == 'Windows'
        shell: pwsh
      - run: poetry install --only test --no-root
        if: runner.os == 'Windows'
        shell: pwsh
      - uses: msys2/setup-msys2@v2.33.0
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: make perl mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-pkgconf
      - name: Linux packages (system libgc and OpenSSL, ccache, libsqlite3-0), when the image lacks them
        if: runner.os == 'Linux'
        run: |
          command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl && pkg-config --atleast-version=8.2.0 bdw-gc && pkg-config --atleast-version=1.2.0 zlib || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libgc-dev zlib1g-dev pkg-config; }
          command -v ccache >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache; }
          dpkg -s libsqlite3-0 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-0; }
      - run: brew install make ccache
        if: runner.os == 'macOS'
      - name: The toolchain, and the machine is the platform of this job
        run: |
          if [ "$RUNNER_OS" = Windows ]; then test "$(command -v gcc)" = /ucrt64/bin/gcc && gcc --version; else cc --version; fi
          "$PYTHON" --version
          node --version
          "$PYTHON" tools/conformance.py host "$PLATFORM"
      - name: Provision the pinned DuckDB library (test-only; the tests never fetch)
        run: |
          lib="$("$PYTHON" tools/provision_duckdb.py --out "$RUNNER_TEMP/duckdb-native")"
          echo "DUCKDB_LIB=$lib" >> "$GITHUB_ENV"
      # The caches that platforms.yml saves on master; this workflow only restores them.
      - run: mkdir -p build && make -s vm-third-party-key > build/native-deps-key
      - run: make -s vm-openssl-key > build/openssl-key-release
        if: env.AGENTICA_OPENSSL == 'vendored'
      - uses: actions/cache/restore@v6
        if: env.AGENTICA_OPENSSL == 'vendored'
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/release/zlib
            build/vm/release/libzlib.a
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/restore@v6
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'mk/*.mk', 'vm/**/*.c', 'vm/**/*.h') }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Build from bootstrap/stage0.agcb (the soak is of the programs the tests run, so the build has no AGENTICA_JIT)
        run: ${{ matrix.make }} all
      - name: The Python tests with AGENTICA_JIT=on (the report names the failed cases)
        env:
          AGENTICA_ACTIONS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ${{ matrix.make }} test-jit-on PYTHON=${{ matrix.python }} CONFORMANCE_PLATFORM=${{ matrix.platform }}
