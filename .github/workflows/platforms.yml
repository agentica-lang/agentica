name: Platforms

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      os:
        description: Which platforms to run
        type: choice
        options: [both, macos, windows]
        default: both

permissions:
  contents: read

jobs:
  embedded-object:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh vm/tools/gen-embedded.sh bootstrap/stage0.agcb stdlib stdlib/MODULES > embedded.s
      - run: cc -c embedded.s -o embedded.o

  embedded-object-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: make mingw-w64-ucrt-x86_64-gcc
      - run: sh vm/tools/gen-embedded.sh bootstrap/stage0.agcb stdlib stdlib/MODULES > embedded.s
      - run: gcc -c embedded.s -o embedded.o

  vm-macos:
    if: inputs.os != 'windows'
    runs-on: macos-15
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_OPENSSL: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && 'vendored' || 'system' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - if: env.AGENTICA_OPENSSL == 'system'
        run: brew install openssl@3 pkg-config
      - if: env.AGENTICA_OPENSSL == 'system'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: cc --version
      - run: make vm-test

  vm-windows:
    if: inputs.os != 'macos'
    runs-on: windows-2025
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_OPENSSL: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && 'vendored' || 'system' }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-pkgconf
      - run: test "$(command -v gcc)" = /ucrt64/bin/gcc && gcc --version
      - run: make vm-test
