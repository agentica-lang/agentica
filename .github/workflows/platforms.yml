name: Platforms

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      os:
        description: Which platforms to run
        type: choice
        options: [both, macos, windows]
        default: both
      openssl:
        description: OpenSSL linkage mode for a manual run
        type: choice
        options: [system, vendored]
        default: system

permissions:
  contents: read

jobs:
  embedded-object:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: sh vm/tools/gen-embedded.sh bootstrap/stage0.agcb stdlib stdlib/MODULES > embedded.s
      - run: cc -c embedded.s -o embedded.o

  embedded-object-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: make mingw-w64-ucrt-x86_64-gcc
      - run: sh vm/tools/gen-embedded.sh bootstrap/stage0.agcb stdlib stdlib/MODULES > embedded.s
      - run: gcc -c embedded.s -o embedded.o

  vm-macos:
    if: inputs.os != 'windows'
    runs-on: macos-15
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_OPENSSL: ${{ (github.event_name == 'workflow_dispatch' && inputs.openssl == 'vendored' || github.ref == 'refs/heads/master' && github.event_name != 'pull_request') && 'vendored' || 'system' }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - if: env.AGENTICA_OPENSSL == 'system'
        run: brew install openssl@3 pkg-config ccache
      - if: env.AGENTICA_OPENSSL == 'vendored'
        run: brew install ccache
      - if: env.AGENTICA_OPENSSL == 'system'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: cc --version
      - run: mkdir -p build && make -s vm-third-party-key > build/native-deps-key
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/restore@v4
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-
      - run: make vm-test
      - run: ccache --show-stats
      - uses: actions/cache/save@v4
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/save@v4
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}

  vm-macos-intel:
    if: inputs.os != 'windows'
    runs-on: macos-15-intel
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_OPENSSL: ${{ (github.event_name == 'workflow_dispatch' && inputs.openssl == 'vendored' || github.ref == 'refs/heads/master' && github.event_name != 'pull_request') && 'vendored' || 'system' }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - if: env.AGENTICA_OPENSSL == 'system'
        run: brew install openssl@3 pkg-config ccache
      - if: env.AGENTICA_OPENSSL == 'vendored'
        run: brew install ccache
      - if: env.AGENTICA_OPENSSL == 'system'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: cc --version
      - run: mkdir -p build && make -s vm-third-party-key > build/native-deps-key
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/restore@v4
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-
      - run: make vm-test
      - run: ccache --show-stats
      - uses: actions/cache/save@v4
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/save@v4
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}

  vm-windows:
    if: inputs.os != 'macos'
    runs-on: windows-2025
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_OPENSSL: ${{ (github.event_name == 'workflow_dispatch' && inputs.openssl == 'vendored' || github.ref == 'refs/heads/master' && github.event_name != 'pull_request') && 'vendored' || 'system' }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: make perl mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-pkgconf
      - run: test "$(command -v gcc)" = /ucrt64/bin/gcc && gcc --version
      - run: mkdir -p build && make -s vm-third-party-key > build/native-deps-key
      - uses: actions/cache/restore@v4
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/restore@v4
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-
      - run: make vm-test
      - run: ccache --show-stats
      - uses: actions/cache/save@v4
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/save@v4
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}
