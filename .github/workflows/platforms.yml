name: Platforms

# Pull requests run these jobs only with the `platforms` label (adding it
# starts a run); pushes to master and manual runs always do.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      os:
        description: Which platforms to run
        type: choice
        options: [both, macos, windows]
        default: both
      openssl:
        description: OpenSSL linkage mode for a manual run (pull requests and master use vendored, as the release does)
        type: choice
        options: [vendored, system]
        default: vendored

permissions:
  contents: read

# An unrelated label gets its own group, so it never cancels a real run;
# master runs are never cancelled, so every merge is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'platforms' && github.run_id || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  embedded-object:
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'platforms') && (github.event.action != 'labeled' || github.event.label.name == 'platforms'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sh vm/tools/gen-embedded.sh bootstrap/stage0.agcb stdlib stdlib/MODULES > embedded.s
      - run: cc -c embedded.s -o embedded.o

  embedded-object-windows:
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'platforms') && (github.event.action != 'labeled' || github.event.label.name == 'platforms'))
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: make mingw-w64-ucrt-x86_64-gcc
      - run: sh vm/tools/gen-embedded.sh bootstrap/stage0.agcb stdlib stdlib/MODULES > embedded.s
      - run: gcc -c embedded.s -o embedded.o

  vm-macos:
    if: inputs.os != 'windows' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'platforms') && (github.event.action != 'labeled' || github.event.label.name == 'platforms'))
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_OPENSSL: ${{ github.event_name == 'workflow_dispatch' && inputs.openssl || 'vendored' }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python3 -m pip install poetry==2.1.2
      - run: poetry install --only test --no-root
      - if: env.AGENTICA_OPENSSL == 'system'
        run: brew install make openssl@3 pkg-config ccache
      - if: env.AGENTICA_OPENSSL == 'vendored'
        run: brew install make ccache
      - if: env.AGENTICA_OPENSSL == 'system'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: cc --version
      - run: mkdir -p build && make -s vm-third-party-key > build/native-deps-key
      - if: env.AGENTICA_OPENSSL == 'vendored'
        run: make -s vm-openssl-key > build/openssl-key-release
      - if: env.AGENTICA_OPENSSL == 'vendored'
        uses: actions/cache@v6
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/restore@v6
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-
      - run: make vm-test
      - name: The vendored OpenSSL is linked statically
        if: env.AGENTICA_OPENSSL == 'vendored'
        run: gmake vendored-check
      - run: gmake fixed-point
      - run: gmake test TESTS="tests/test_single_binary.py tests/test_filesystem.py tests/test_source_paths.py tests/test_vm_os.py tests/test_process.py tests/test_process_bdd.py tests/test_bdd.py tests/test_bdd_posix.py tests/test_process_lifecycle.py tests/test_vm_child_channel.py tests/test_vm_stdout.py tests/test_vm_tcp.py tests/test_vm_tls.py tests/test_vm_http.py tests/test_vm_lazy_io.py tests/test_platform_bootstrap.py"
      - name: Destructive filesystem regressions in Actions-owned scratch
        run: make test-remove-actions
        env:
          AGENTICA_ACTIONS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      - run: ccache --show-stats
      - uses: actions/cache/save@v6
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/save@v6
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}

  vm-macos-latest:
    if: inputs.os != 'windows' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'platforms') && (github.event.action != 'labeled' || github.event.label.name == 'platforms'))
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_OPENSSL: ${{ github.event_name == 'workflow_dispatch' && inputs.openssl || 'vendored' }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python3 -m pip install poetry==2.1.2
      - run: poetry install --only test --no-root
      - if: env.AGENTICA_OPENSSL == 'system'
        run: brew install make openssl@3 pkg-config ccache
      - if: env.AGENTICA_OPENSSL == 'vendored'
        run: brew install make ccache
      - if: env.AGENTICA_OPENSSL == 'system'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: cc --version
      - run: mkdir -p build && make -s vm-third-party-key > build/native-deps-key
      - if: env.AGENTICA_OPENSSL == 'vendored'
        run: make -s vm-openssl-key > build/openssl-key-release
      - if: env.AGENTICA_OPENSSL == 'vendored'
        uses: actions/cache@v6
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/restore@v6
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-
      - run: make vm-test
      - name: The vendored OpenSSL is linked statically
        if: env.AGENTICA_OPENSSL == 'vendored'
        run: gmake vendored-check
      - run: gmake fixed-point
      - run: gmake test TESTS="tests/test_single_binary.py tests/test_filesystem.py tests/test_source_paths.py tests/test_vm_os.py tests/test_process.py tests/test_process_bdd.py tests/test_bdd.py tests/test_bdd_posix.py tests/test_process_lifecycle.py tests/test_vm_child_channel.py tests/test_vm_stdout.py tests/test_vm_tcp.py tests/test_vm_tls.py tests/test_vm_http.py tests/test_vm_lazy_io.py tests/test_platform_bootstrap.py"
      - name: Destructive filesystem regressions in Actions-owned scratch
        run: make test-remove-actions
        env:
          AGENTICA_ACTIONS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      - run: ccache --show-stats
      - uses: actions/cache/save@v6
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/save@v6
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}

  vm-windows:
    if: inputs.os != 'macos' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'platforms') && (github.event.action != 'labeled' || github.event.label.name == 'platforms'))
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_OPENSSL: ${{ github.event_name == 'workflow_dispatch' && inputs.openssl || 'vendored' }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install poetry==2.1.2
        shell: pwsh
      - run: poetry install --only test --no-root
        shell: pwsh
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: make perl mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-pkgconf
      - run: test "$(command -v gcc)" = /ucrt64/bin/gcc && gcc --version
      - run: mkdir -p build && make -s vm-third-party-key > build/native-deps-key
      - if: env.AGENTICA_OPENSSL == 'vendored'
        run: make -s vm-openssl-key > build/openssl-key-release
      - if: env.AGENTICA_OPENSSL == 'vendored'
        uses: actions/cache@v6
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/restore@v6
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-
      - run: make vm-test
      - name: The vendored OpenSSL is linked statically, without msys-2.0.dll
        if: env.AGENTICA_OPENSSL == 'vendored'
        run: make vendored-check
      - run: make build/vm/release/bootstrap/agentica.exe
      - name: Bootstrap driver smoke
        env:
          AGENTICA_VM_BINARY: build/vm/release/bootstrap/agentica.exe
        run: poetry run python -m pytest tests/test_platform_bootstrap.py
      - run: make fixed-point
      - run: make test PYTHON=python TESTS="tests/test_single_binary.py tests/test_source_paths.py tests/test_windows_metadata_and_locks.py tests/test_process.py tests/test_process_windows.py tests/test_process_bdd.py tests/test_bdd.py tests/test_process_lifecycle.py tests/test_vm_child_channel.py tests/test_vm_stdout.py tests/test_vm_tcp.py tests/test_vm_tls.py tests/test_vm_http.py tests/test_windows_console_stop.py tests/test_vm_lazy_io.py tests/test_platform_bootstrap.py"
      - name: Destructive filesystem regressions in Actions-owned scratch
        run: make test-remove-actions PYTHON=python
        env:
          AGENTICA_ACTIONS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      - run: ccache --show-stats
      - uses: actions/cache/save@v6
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() }}
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'vm/**/*.c', 'vm/**/*.h') }}
