name: Platforms

# The conformance matrix: the same areas on Linux x86_64, Linux ARM64, Windows x86_64, macOS Intel and macOS ARM, one job
# per system, named by platform and architecture (the names of the release packages). Each job builds from bootstrap/stage0.agcb,
# runs the C tests, the fixed point and then every area of tools/conformance.py, and ends with a report in the job
# summary that fails when an area has no passed case, a module did not finish, or a case was skipped for a reason that is
# not on the reviewed list (host-only: pairs in HOST_ONLY_ALLOWED; known-issue: numbers in KNOWN_ISSUES). A last job,
# `conformance all-systems`, puts the five summaries side by side and fails when a case ran on no system.
# Pushes to master and manual runs always run all five. A pull request runs all five with the `platforms` label, or only
# the systems of its `platform:windows-x86_64`, `platform:macos-x86_64` and `platform:macos-arm64` labels (Linux has
# no label of its own: ci.yml tests it); with none of these labels it runs nothing. Adding one of these labels starts a
# run; another label never starts or cancels one.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      openssl:
        description: OpenSSL linkage mode for a manual run on macOS and Windows (pull requests and master use vendored, as the release does)
        type: choice
        options: [vendored, system]
        default: vendored

permissions:
  contents: read

# An unrelated label gets its own group, so it never cancels a real run;
# master runs are never cancelled, so every merge is tested. The label list is
# the same as in the `if` of the `systems` job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && !contains(fromJSON('["platforms", "platform:windows-x86_64", "platform:macos-x86_64", "platform:macos-arm64"]'), github.event.label.name) && github.run_id || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runners can be slow: every deadline of the tests is multiplied by this, as in ci.yml (references/ci.md). Linux
# keeps the 4 as well, so that one number holds on every system and a test that needs a longer deadline on a slow
# macOS or Windows runner is not hidden by a quicker Linux one.
env:
  AGENTICA_TEST_TIMEOUT_SCALE: '4'

jobs:
  # Picks the systems from the event and the labels; `conformance` runs this matrix. The job runs only when the event
  # may select a system: the `"platform` prefilter also matches `platforms`, and the step does the exact match.
  systems:
    if: github.event_name != 'pull_request' || contains(toJSON(github.event.pull_request.labels.*.name), '"platform') && (github.event.action != 'labeled' || contains(fromJSON('["platforms", "platform:windows-x86_64", "platform:macos-x86_64", "platform:macos-arm64"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
      all: ${{ steps.pick.outputs.all }}
    steps:
      - id: pick
        env:
          ALL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'platforms') }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: python3 {0}
        run: |
          import json, os
          systems = [
              {"platform": "linux-x86_64", "runner": "ubuntu-latest", "make": "make", "python": "python3", "shell": "bash"},
              {"platform": "linux-arm64", "runner": "ubuntu-24.04-arm", "make": "make", "python": "python3", "shell": "bash"},
              {"platform": "windows-x86_64", "runner": "windows-2025", "make": "make", "python": "python", "shell": "msys2 {0}"},
              {"platform": "macos-x86_64", "runner": "macos-15-intel", "make": "gmake", "python": "python3", "shell": "bash"},
              {"platform": "macos-arm64", "runner": "macos-latest", "make": "gmake", "python": "python3", "shell": "bash"},
          ]
          # Linux has no label of its own (ci.yml tests Linux x86_64; Linux ARM64 runs with `platforms`).
          labelled = {"windows-x86_64", "macos-x86_64", "macos-arm64"}
          if os.environ["ALL"] != "true":
              names = {label.removeprefix("platform:") for label in json.loads(os.environ["LABELS"] or "[]")}
              systems = [s for s in systems if s["platform"] in labelled & names]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps({'include': systems})}\n")
              out.write(f"count={len(systems)}\n")
              out.write(f"all={'true' if len(systems) == 5 else 'false'}\n")
          print("systems:", ", ".join(s["platform"] for s in systems) or "none")

  conformance:
    name: conformance ${{ matrix.platform }}
    needs: systems
    if: needs.systems.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.systems.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      AGENTICA_REQUIRE_VM: '1'
      # Linux builds with the system libgc and OpenSSL, as ci.yml does (ci.yml and the release check the vendored link
      # there); the other systems link the vendored OpenSSL, as the release does.
      AGENTICA_OPENSSL: ${{ startsWith(matrix.platform, 'linux-') && 'system' || github.event_name == 'workflow_dispatch' && inputs.openssl || 'vendored' }}
      # Linux links the system zlib, the others the vendored one, as the release does.
      AGENTICA_ZLIB: ${{ startsWith(matrix.platform, 'linux-') && 'system' || 'vendored' }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      PYTHON: ${{ matrix.python }}
      PLATFORM: ${{ matrix.platform }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python3 -m pip install poetry==2.1.2 && poetry install --only test --no-root
        if: runner.os != 'Windows'
      - run: python -m pip install poetry==2.1.2
        if: runner.os == 'Windows'
        shell: pwsh
      - run: poetry install --only test --no-root
        if: runner.os == 'Windows'
        shell: pwsh
      - uses: ./.github/actions/msys2
        if: runner.os == 'Windows'
        with:
          install: make perl mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-pkgconf
      - name: Linux packages (system libgc and OpenSSL, ccache, libsqlite3-0), when the image lacks them
        if: runner.os == 'Linux'
        run: |
          command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl && pkg-config --atleast-version=8.2.0 bdw-gc && pkg-config --atleast-version=1.2.0 zlib || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libgc-dev zlib1g-dev pkg-config; }
          command -v ccache >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache; }
          dpkg -s libsqlite3-0 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-0; }
      - if: runner.os == 'macOS' && env.AGENTICA_OPENSSL == 'system'
        run: brew install make openssl@3 pkg-config ccache
      - if: runner.os == 'macOS' && env.AGENTICA_OPENSSL == 'vendored'
        run: brew install make ccache
      - if: runner.os == 'macOS' && env.AGENTICA_OPENSSL == 'system'
        run: echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: The toolchain, and the machine is the platform of this job
        run: |
          if [ "$RUNNER_OS" = Windows ]; then test "$(command -v gcc)" = /ucrt64/bin/gcc && gcc --version; else cc --version; fi
          "$PYTHON" --version
          node --version
          "$PYTHON" tools/conformance.py host "$PLATFORM"
      - run: mkdir -p build && make -s vm-third-party-key > build/native-deps-key
      - if: env.AGENTICA_OPENSSL == 'vendored'
        run: make -s vm-openssl-key > build/openssl-key-release
      - if: env.AGENTICA_OPENSSL == 'vendored'
        uses: actions/cache@v6
        with:
          path: |
            build/vm/release/openssl/include
            build/vm/release/openssl/libssl.a
            build/vm/release/openssl/libcrypto.a
            build/vm/release/openssl-flags
          key: openssl-release-${{ hashFiles('build/openssl-key-release') }}
      - uses: actions/cache/restore@v6
        with:
          path: |
            build/vm/release/uv
            build/vm/release/libuv.a
            build/vm/release/third-party-flags
            build/vm/release/yyjson.o
            build/vm/release/picohttpparser.o
            build/vm/release/zlib
            build/vm/release/libzlib.a
            build/vm/gc.o
            build/vm/gc-flags
          key: native-deps-release-${{ hashFiles('build/native-deps-key') }}
      - uses: actions/cache/restore@v6
        with:
          path: build/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'mk/*.mk', 'vm/**/*.c', 'vm/**/*.h') }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      # Windows flake experiment (never merged): only the build and tools/exp-win.py.
      - name: Build
        id: build
        run: ${{ matrix.make }} -j4
      - name: "Windows flakes #1335 #1098 #1332"
        run: |
          set -o pipefail
          poetry run python tools/exp-win.py dist/agentica.exe 2>&1 | tee build/exp-win.txt
      - name: Results
        if: ${{ !cancelled() }}
        run: |
          { echo '```'; cat build/exp-win.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: exp-win-${{ matrix.platform }}
          path: build/exp-win.txt

  # The five summaries side by side: a case that no system ran (host-only or open gap on all of them) proves nothing,
  # and one job cannot see that. It runs only when all five systems were picked: on a subset (`platform:<system>`
  # labels) a case the other systems cover would look unrun, so the check would fail for no reason.
  summary:
    name: conformance all-systems
    needs: [systems, conformance]
    if: ${{ !cancelled() && needs.conformance.result != 'skipped' && needs.systems.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: conformance-*
          path: build/conformance-all
      - name: Every case ran on at least one system
        run: python3 tools/conformance.py merge build/conformance-all
