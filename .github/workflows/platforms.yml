name: Platforms

# Since step 8d-2 the product is one Linux binary (the front end and the std/ sources are embedded with .incbin, which
# is ELF only), so this workflow checks only that the C VM and its tests still build and pass here. The golden tests
# run on the binary and need Linux.

on:
  workflow_dispatch:
    inputs:
      os:
        description: Which platforms to run
        type: choice
        options: [both, macos, windows]
        default: both

permissions:
  contents: read

jobs:
  vm-macos:
    if: inputs.os != 'windows'
    runs-on: macos-15
    env:
      AGENTICA_REQUIRE_VM: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: cc --version
      - run: make vm-test

  vm-windows:
    if: inputs.os != 'macos'
    runs-on: windows-2025
    env:
      AGENTICA_REQUIRE_VM: '1'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: make mingw-w64-ucrt-x86_64-gcc
      - run: test "$(command -v gcc)" = /ucrt64/bin/gcc && gcc --version
      - run: make vm-test
