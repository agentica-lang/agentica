name: Site examples

on:
  pull_request:
    paths:
      - 'site/content/**'
      - 'tests/site-examples-test.rkt'
      - '.github/workflows/site-examples.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site-examples:
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: racket
        run: |
          dir="$RUNNER_TOOL_CACHE/racket-cs-9.3"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if "$dir/bin/racket" -e '(exit (if (equal? (version) "9.3") 0 1))' 2>/dev/null; then
            echo "$dir/bin" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.racket.outputs.found != 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          variant: CS
          version: '9.3'
          dest: ${{ steps.racket.outputs.dir }}
      - uses: actions/cache@v4
        with:
          path: |
            src/compiled
            tests/compiled
          key: racket-zo-${{ github.job }}-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
          restore-keys: |
            racket-zo-test-9.3-${{ hashFiles('src/**', 'stdlib/**', 'tests/**/*.rkt') }}
            racket-zo-${{ github.job }}-9.3-
            racket-zo-test-9.3-
      - run: git ls-files -z | xargs -0 touch
      - run: command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl && pkg-config --atleast-version=8.2.0 bdw-gc || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libgc-dev pkg-config; }
      - run: make build vm
      - run: raco test tests/site-examples-test.rkt
