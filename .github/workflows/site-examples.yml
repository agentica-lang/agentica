name: Site examples

on:
  pull_request:
    paths:
      - 'site/content/**'
      - 'tests/test_site_examples.py'
      - '.github/workflows/site-examples.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install poetry==2.1.2
      - run: poetry install --only test --no-root
      - run: command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl && pkg-config --atleast-version=8.2.0 bdw-gc || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libgc-dev pkg-config; }
      - run: make dist/agentica
      - run: make test-slow TESTS=tests/test_site_examples.py
