name: Pages

on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/grammar.md'
      - 'docs/grammar/**'
      - '.github/workflows/pages.yml'
      - 'Makefile'
      - 'mk/**'
      - 'tools/site_versions.py'
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/grammar.md'
      - 'docs/grammar/**'
      - '.github/workflows/pages.yml'
      - 'Makefile'
      - 'mk/**'
      - 'tools/site_versions.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The pins of Hugo and Dart Sass. tools/site_versions.py reads them from this file in each tag's tree, so an old
    # tag builds with its own versions; keep the four names and the one-line form.
    env:
      HUGO_VERSION: 0.167.0
      HUGO_SHA256: 0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957
      DART_SASS_VERSION: 1.105.1
      DART_SASS_SHA256: 9046fdd4a31a524a0020298c55d9e155d4c22363ef268e8992574335a72c6a6f
    steps:
      # Full history and tags: every release is built from its own tree (git archive).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The docs theme (only this submodule: the VM's are not needed), with its history, so that
      # tools/site_versions.py can unpack the theme commit that each tag pins.
      - run: git submodule update --init site/themes/docs-theme
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/themes/docs-theme/highlight/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      # The cache holds the output of each tag by commit sha and base URL (a sha never changes, so an entry is never
      # wrong). Each run restores the newest entry of the script's version. Only a run that is not a pull request and
      # built something new saves one (also after a failed build, so the tags that did build are kept); the script
      # prunes the folder to the current builds first. Hugo and Dart Sass come from the pins of each tag's pages.yml,
      # which tools/site_versions.py downloads and checks.
      - uses: actions/cache/restore@v5
        with:
          path: build/site-versions/cache
          key: site-versions-${{ hashFiles('tools/site_versions.py') }}-${{ github.run_id }}
          restore-keys: |
            site-versions-${{ hashFiles('tools/site_versions.py') }}-
      - id: build
        run: python3 -I tools/site_versions.py build --base-url "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.build.outputs.fresh == 'true' }}
        with:
          path: build/site-versions/cache
          key: site-versions-${{ hashFiles('tools/site_versions.py') }}-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site-versions/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
