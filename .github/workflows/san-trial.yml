name: san-trial

# Temporary trial for #1380 (never merged): the ASan+UBSan binary on x86-64 and arm64 against HWASan+UBSan on arm64,
# the same build, C tests and vm-sanitize-test modules in one job each.
on:
  push:
    branches: [san-trial]

permissions:
  contents: read

env:
  AGENTICA_TEST_TIMEOUT_SCALE: '4'

jobs:
  trial:
    name: ${{ matrix.kind }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            kind: hwaddress
    env:
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: sampled
      SANITIZE: '1'
      SANITIZE_KIND: ${{ matrix.kind }}
      HWASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          sanitizers: 'true'
      - name: Tools
        run: |
          clang --version; nproc; uname -r
          command -v ccache || echo "no ccache"
          ls "$(clang -print-resource-dir)"/lib/linux/ | grep -E 'hwasan|asan' || ls -R "$(clang -print-resource-dir)"/lib | grep -E 'hwasan|asan' || true
      - name: Probe one C test (hwaddress alone, then with undefined)
        run: |
          sudo apt-get install -y --no-install-recommends gdb > /dev/null 2>&1 || { sudo apt-get update > /dev/null && sudo apt-get install -y --no-install-recommends gdb > /dev/null; }
          cat /proc/sys/abi/tagged_addr_disabled 2>/dev/null || echo "no tagged_addr_disabled"
          for kind in hwaddress hwaddress,undefined; do
            rm -rf build/vm/sanitize
            make -j"$(nproc)" build/vm/sanitize/budget-test SANITIZE_KIND=$kind > /dev/null 2>&1 || make -j"$(nproc)" build/vm/sanitize/budget-test SANITIZE_KIND=$kind 2>&1 | tail -20
            echo "== $kind"
            HWASAN_OPTIONS=verbosity=1 build/vm/sanitize/budget-test 2>&1 | tail -20 || true
            gdb -batch -ex run -ex bt -ex 'x/4i $pc-8' -ex 'info registers x0 x1 x16 x17' build/vm/sanitize/budget-test 2>&1 | tail -30 || true
          done
      - name: Build
        if: false
        run: make -j"$(nproc)" vm-sanitize-build
      - name: C tests
        if: false
        run: make -j"$(nproc)" vm-test
      - name: vm-sanitize-test, all modules
        if: false
        run: make vm-sanitize-test
      - name: ccache install time
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: time sudo apt-get install -y --no-install-recommends ccache || { time sudo apt-get update; time sudo apt-get install -y --no-install-recommends ccache; }
