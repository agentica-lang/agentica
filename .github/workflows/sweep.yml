name: Full sweep

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    runs-on: [self-hosted, linux, docker-runner]
    timeout-minutes: 90
    env:
      AGENTICA_TEST_TIMEOUT_SCALE: '4'
      AGENTICA_REQUIRE_VM: '1'
      AGENTICA_SWEEP: full
      AGENTICA_GC: vendored
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          python3 --version
          command -v pkg-config >/dev/null && pkg-config --atleast-version=3.0.0 openssl && pkg-config --atleast-version=8.2.0 bdw-gc || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev libgc-dev pkg-config; }
      - run: make vm-diff-build
      - run: make sweep-full
