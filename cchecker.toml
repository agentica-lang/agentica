# Settings of cchecker for vm/ (make cchecker; references/ci.md of the development skill). The pinned version is
# CCHECKER_VERSION in mk/vm-test.mk; docs/settings.md of that release describes every key.

# The library knowledge, all on (the default), listed so a turned-off family shows in review. The roots of the rules are
# inferred from it: a function passed to a libuv call that runs it on the loop thread (uv_read_start, uv_write,
# uv_timer_start, uv_close, ...) is a short root, which must never reach a blocking call (docs/vm/14-core-invariants.md).
# The marks of vm/cchecker.h in the C are for ownership (CC_OWNS, CC_FREES, CC_GC_ALLOC), for the lock helpers
# (CC_ACQUIRES, CC_RELEASES) and for a name too common for the settings (CC_ASSUME_SHORT on step in files.c).
[library]
libc_blocking = true
pthread_blocking = true
libuv_blocking = true
libgc_blocking = true
libuv_callbacks_short = true
libgc_alloc = true
libc_nonblocking_flags = true

# The steps that run on the loop's thread by contract: passed to agc_loop_call, agc_io_call or call_on (vm/loop.c), or
# stored in agc_forward_wait.resume. Inference does not find them: a step reaches the loop through call_on's parameter
# or agc_request.call. reader_go (vm/stdio_windows.c) is one too, outside this Linux database.
[roots]
short = ["release_step", "drop_request", "half_close_step", "direct_over", "close_step", "stop_request", "waiter_end",
         "attach_step", "give_back_step", "poller_wait_run", "poller_pause_run", "poller_close_run", "start_stream",
         "resume_err"]

# What the code knows and cchecker cannot see.
[assume]
# AGC_TRACE (vm/trace.h) calls agc_trace_emit only when the category is on in the mask of a debug run
# (AGENTICA_VM_TRACE), so the write inside it is not on a path of a normal run.
stop = ["agc_trace_emit"]

# Fine on the loop thread, each for its reason:
# - agc_proc_read_now: a read of a libuv pipe, which is O_NONBLOCK (EAGAIN is AGC_PROC_NOTHING).
# - read_once: stdin reopened O_NONBLOCK by agc_fd_reopen, or a socket read with MSG_DONTWAIT.
# - agc_fd_reopen: an open of the descriptor's own path (/proc/self/fd/N, F_GETPATH on macOS) with O_NONBLOCK.
# - agc_stdio_try: writes what the target takes now and never waits (vm/port.h).
# - call_on: runs a loop step inline or queues it; the steps are roots of their own ([roots] above).
# - agc_compute_submit, agc_compute_submit_direct: pool->lock is held for bounded sections (a queue link, a thread
#   start, an inbox post, a nudge).
# - release_state: the release flush of a handle not closed, one bounded write (docs/vm/14-core-invariants.md §14.1).
# - agc_register, agc_unregister: reg->lock is held for a swap, a push or a copy; an agc_alloc there may collect, which
#   stops the loop's thread anyway.
short = ["agc_proc_read_now", "read_once", "agc_fd_reopen", "agc_stdio_try", "call_on", "agc_compute_submit",
         "agc_compute_submit_direct", "release_state", "agc_register", "agc_unregister"]

# The I/O inbox's lock is held to link one request; the poster wakes the loop after the unlock (vm/inbox.c). The run
# queue's lock is held to link or unlink tasks: its waits give it back (uv_cond_wait), and a push signals after the
# unlock (vm/runq.c), so the loop thread may wake a task (fail_stream under agc_output_forward).
short_locks = ["agc_inbox.lock", "agc_runq.lock"]

# agc_request.call holds both the compute pool's work (it blocks, on a pool thread) and the loop's REQ_CALL steps.
stop_fields = ["agc_request.call"]

# The checked accessors return, or jump out through agc_wrong_tag on hostile bytecode: a jump leaks an owned malloc'd
# pointer (#1251), or holds a lock that agc_sync_reset does not give back, so a function checks the tags first.
# cchecker 0.2.0 ends a path at the noreturn agc_wrong_tag and so cannot see the jump through them
# (agentica-lang/cchecker#66; #1256 replaces this list).
may_jump = ["agc_as_ats", "agc_as_bool", "agc_as_bytes", "agc_as_c_pointer", "agc_as_c_resource", "agc_as_channel",
            "agc_as_enum", "agc_as_float", "agc_as_fn", "agc_as_handle", "agc_as_http_client", "agc_as_http_server",
            "agc_as_int", "agc_as_json", "agc_as_lazy", "agc_as_list", "agc_as_listener", "agc_as_map", "agc_as_mutex",
            "agc_as_process", "agc_as_range", "agc_as_result", "agc_as_set", "agc_as_socket", "agc_as_string",
            "agc_as_struct", "agc_as_task", "agc_as_test_case", "agc_as_tls_context"]
