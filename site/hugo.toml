baseURL = "https://sonic182.github.io/agentica/"
locale = "en"
title = "Agentica"
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "Agentica is Ruby with static types: Ruby-like syntax, checked before running, with immutable values."
  repo = "https://github.com/sonic182/agentica"
  repoPublic = false
  narrow = "50rem"

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[outputFormats.search]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "search"]

[minify]
  minifyOutput = true

[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "../docs/grammar.md"
  target = "content/reference.md"

[[cascade]]
  title = "Language specification"
  weight = 4
  [cascade.target]
    path = "/reference"
