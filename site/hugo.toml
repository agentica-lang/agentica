# The look, the layouts, the outputs and the highlighter come from the docs theme (themes/docs-theme). The deep
# merge takes its [outputs], [markup] and [minify] defaults too; this file sets only what is the site's own.
_merge = "deep"
baseURL = "https://agentica-lang.github.io/agentica/"
locale = "en"
title = "Agentica"
theme = "docs-theme"
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "Agentica is Ruby with static types: Ruby-like syntax, checked before running, with immutable values."
  tagline = "Ruby with static types"
  repo = "https://github.com/agentica-lang/agentica"
  branch = "master"
  repoPublic = false

[module.hugoVersion]
  extended = true
  min = "0.167.0"

# A mount of the site replaces Hugo's default for its target root, so content and assets are listed with the grammar.
[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "../docs/grammar"
  target = "assets/grammar"
