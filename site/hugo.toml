baseURL = "https://sonic182.github.io/agentica/"
locale = "en"
title = "Agentica"
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "Agentica is Ruby with static types: Ruby-like syntax, checked before running, with immutable values."
  repo = "https://github.com/sonic182/agentica"
  repoPublic = false

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "../.agents/skills/agentica-programming/SKILL.md"
  target = "content/guide.md"

[[module.mounts]]
  source = "../docs/grammar.md"
  target = "content/reference.md"

[[module.mounts]]
  source = "../.agents/skills/agentica-programming/references"
  target = "content/library"

