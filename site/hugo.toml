baseURL = "https://agentica-lang.github.io/agentica/"
locale = "en"
title = "Agentica"
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "Agentica is Ruby with static types: Ruby-like syntax, checked before running, with immutable values."
  repo = "https://github.com/agentica-lang/agentica"
  repoPublic = false
  narrow = "50rem"

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2

[outputFormats.search]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

[minify]
  minifyOutput = true

[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "../docs/grammar"
  target = "assets/grammar"

[[cascade]]
  title = "Language specification"
  description = "The formal grammar and rules of the Agentica language."
  weight = 4
  [cascade.target]
    path = "/reference"

[outputs]
  home = ["html", "markdown", "search", "llms", "llmsfull"]
  section = ["html", "markdown"]
  page = ["html", "markdown"]

[outputFormats.llms]
  baseName = "llms"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true

[outputFormats.llmsfull]
  baseName = "llms-full"
  mediaType = "text/plain"
  isPlainText = true
  notAlternative = true
