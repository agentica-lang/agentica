{{ define "main" }}
<article class="content">
  {{- partial "page-actions.html" . }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul class="pages">
    {{- range .Pages.ByWeight }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      {{- $heading := partial "heading.html" . }}
      {{- if and $heading (ne $heading .LinkTitle) }} <span>{{ $heading }}</span>{{ end }}
    </li>
    {{- end }}
  </ul>
</article>
{{ end }}
